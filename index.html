<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>万象森罗 V12.0 - 圣人观象版</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root { --main: #d4af37; --bg: #0a0a0b; --text: #e0d8c0; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: "PingFang SC", "楷体", serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .bg-pattern { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(#222 1px, transparent 0); background-size: 40px 40px; z-index: -1; opacity: 0.3; }
        
        .container { max-width: 500px; width: 100%; background: #121214; border: 2px solid #2a2a2d; border-radius: 8px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); position: relative; }
        .container::after { content: ""; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px; border: 1px solid #2a2a2d; pointer-events: none; }

        h1 { font-size: 20px; text-align: center; color: var(--main); letter-spacing: 5px; margin: 0 0 5px 0; }
        .subtitle { font-size: 10px; text-align: center; color: #666; margin-bottom: 25px; }

        .input-box { width: 100%; position: relative; margin-bottom: 20px; }
        input { width: 100%; background: #000; border: 1px solid #3d3d42; color: var(--main); padding: 15px; font-size: 14px; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--main); }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 15px; border: 1px solid var(--main); cursor: pointer; font-weight: bold; transition: 0.3s; font-family: inherit; }
        .btn-intel { background: transparent; color: var(--main); }
        .btn-divine { background: var(--main); color: #000; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        #resultArea { margin-top: 30px; display: none; border-top: 1px solid #333; padding-top: 20px; }
        .gua-display { text-align: center; margin-bottom: 25px; }
        .gua-mark { font-size: 60px; color: var(--main); margin-bottom: 5px; text-shadow: 0 0 15px rgba(212,175,55,0.4); }
        .gua-name { font-size: 22px; font-weight: bold; letter-spacing: 3px; }

        .dimension { margin-bottom: 20px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 4px; }
        .dim-tag { font-size: 11px; color: var(--main); margin-bottom: 8px; border-left: 3px solid var(--main); padding-left: 8px; }
        .dim-content { font-size: 14px; line-height: 1.8; color: #bbb; text-align: justify; }
        .highlight { color: #fff; text-decoration: underline var(--main); }

        #log { font-size: 11px; color: #555; text-align: center; margin-top: 10px; min-height: 15px; }
    </style>
</head>
<body>

<div class="bg-pattern"></div>

<div class="container" id="captureArea">
    <h1>万象森罗 · 圣人观象</h1>
    <div class="subtitle">UNIVERSAL INFERENCE ENGINE V12.0 // BY GEMINI ARCHITECT</div>
    
    <div class="input-box">
        <input type="text" id="target" placeholder="▶ 输入观测目标 ◀">
    </div>

    <div class="btn-row">
        <button onclick="fetchIntel()" class="btn-intel" id="btn1">① 垂象取义</button>
        <button onclick="runDivination()" class="btn-divine" id="btn2" disabled>② 演卦推命</button>
    </div>

    <div id="log"></div>

    <div id="resultArea">
        <div class="gua-display">
            <div id="resIcon" class="gua-mark"></div>
            <div id="resName" class="gua-name"></div>
        </div>

        <div class="dimension">
            <div class="dim-tag">【天时 · 宏观大势】</div>
            <div id="dim1" class="dim-content"></div>
        </div>

        <div class="dimension">
            <div class="dim-tag">【地利 · 情报具象】</div>
            <div id="dim2" class="dim-content"></div>
        </div>

        <div class="dimension">
            <div class="dim-tag">【人和 · 众生纠缠】</div>
            <div id="dim3" class="dim-content"></div>
        </div>

        <div class="dimension">
            <div class="dim-tag">【神机 · 终极判词】</div>
            <div id="dim4" class="dim-content"></div>
        </div>

        <button onclick="exportImg()" style="width:100%; background:#eee; color:#000; border:none; margin-top:20px;">留存天机拓片</button>
    </div>
</div>

<script>
const TAVILY_KEY = "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"; 

const GUA_DATA = [
    { n: "乾为天", i: "䷀", d: "元亨利贞，极阳之象。", m: "处于剧烈扩张与秩序重建的巅峰。" },
    { n: "兑为泽", i: "䷹", d: "刚中柔外，喜悦之象。", m: "信息流转极快，表象繁华下暗藏交换。" },
    { n: "离为火", i: "䷝", d: "附丽光明，明察之象。", m: "局势处于聚光灯下，因果透明化。" },
    { n: "震为雷", i: "䷲", e: "震惊百里, 动荡之象。", m: "突发变数正在打破现有的沉闷平衡。" },
    { n: "巽为风", i: "䷸", d: "随风潜入，渗透之象。", m: "某种力量正在无声无息地进行结构转移。" },
    { n: "坎为水", i: "䷜", d: "陷险而进，重重之象。", m: "处于极其危险的低谷，真相被多层屏蔽。" },
    { n: "艮为山", i: "䷳", d: "动静得宜，止步之象。", m: "遭遇不可逾越的阻碍，需向内求索。" },
    { n: "坤为地", i: "䷷", d: "柔顺利贞，承载之象。", m: "厚积薄发，一切变动皆在暗处滋生。" }
];

let capturedIntel = [];

async function fetchIntel() {
    const t = document.getElementById('target').value;
    if(!t) return alert("请输入目标");
    const log = document.getElementById('log');
    log.innerText = "正在感应场域，同步真实情报...";
    
    try {
        const response = await fetch('https://api.tavily.com/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ api_key: TAVILY_KEY, query: t, search_depth: "basic", max_results: 5 })
        });
        const data = await response.json();
        capturedIntel = data.results || [];
        log.innerText = "✅ 现实观测完成，情报已入卦。";
        document.getElementById('btn2').disabled = false;
    } catch (e) {
        log.innerText = "⚠️ 外部受阻，启用先天八卦推演。";
        document.getElementById('btn2').disabled = false;
    }
}

function runDivination() {
    const target = document.getElementById('target').value;
    const log = document.getElementById('log');
    log.innerText = "正在拨动太极，推演因果...";
    
    // 🧮 核心演卦逻辑：基于情报内容的语义倾向定卦
    let score = 0;
    const allText = capturedIntel.map(i => i.content + i.title).join("");
    
    // 语义权重分流
    if (/(死|查|捕|案|跌|损|险|疑)/.test(allText)) score -= 10;
    if (/(涨|新|升|胜|活|成|解|立)/.test(allText)) score += 10;
    
    const hash = target.split('').reduce((a,b)=>((a<<5)-a)+b.charCodeAt(0),0);
    const finalIndex = Math.abs(hash + score) % 8;
    const gua = GUA_DATA[finalIndex];

    // 渲染结果
    document.getElementById('resIcon').innerText = gua.i;
    document.getElementById('resName').innerText = gua.n;

    // 注入真实情报的“易理化”描述
    const news1 = capturedIntel[0] ? capturedIntel[0].title.substring(0,15) : "混沌未开";
    const news2 = capturedIntel[1] ? capturedIntel[1].content.substring(0,18) : "幽冥之境";

    document.getElementById('dim1').innerHTML = `卦象显示为「${gua.n}」。从天道来看，目标正处于<span class="highlight">${gua.m}</span>其势在「${news1}」中已有显现，预示着宏观层面的秩序正在发生不可逆的倾斜。`;

    document.getElementById('dim2').innerHTML = `地利聚焦于局部变量。情报切片提及「${news2}...」，这正是此卦的<span class="highlight">阴阳交互点</span>。在特定场域内，真实与虚幻的界限已因该情报而坍缩。`;

    document.getElementById('dim3').innerHTML = `众生念力纠缠。对于「${target}」，人心的贪婪与恐惧正在被卦象中的<span class="highlight">${gua.d.substring(0,4)}</span>所引导。若顺势而为则亨，若逆天而行则吝。`;

    document.getElementById('dim4').innerHTML = `<b>【圣人判词】：</b>天垂象，见吉凶。针对「${target}」，当代因果已成。唯有把握「${news1.substring(0,5)}」这一线神机，方能在「${gua.n}」的局势中寻得一线生机。`;

    document.getElementById('resultArea').style.display = 'block';
}

function exportImg() {
    html2canvas(document.getElementById('captureArea'), { backgroundColor: '#0a0a0b' }).then(c => {
        const a = document.createElement('a');
        a.href = c.toDataURL();
        a.download = `万象拓片_${Date.now()}.png`;
        a.click();
    });
}
</script>
</body>
</html>
