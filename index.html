<script>
// 优化后的哈希算法：引入时间扰动因子，模拟“当下”的天机
function advancedHash(s) {
    let r = 0;
    const seed = new Date().getMinutes(); // 引入分钟级变量，模拟时空流转
    for(let i=0; i<s.length; i++) {
        r = (r << 5) - r + s.charCodeAt(i) + seed;
    }
    return Math.abs(r);
}

function runInference() {
    const target = document.getElementById('target').value;
    if(!target) return alert("请先输入推演对象");

    const p = document.getElementById('p_val').value; // 天时
    const e = document.getElementById('e_val').value; // 地利
    const s = document.getElementById('s_val').value; // 人和
    const t = document.getElementById('t_val').value; // 神机
    
    // 核心因果链计算
    const combinedHash = advancedHash(target + p + e + s + t);
    const upG = (combinedHash % 8) + 1;
    const lowG = ((combinedHash >> 3) % 8) + 1;
    const changeYao = (combinedHash % 6) + 1; // 模拟动爻：六爻之变

    // 氛围渲染
    document.documentElement.style.setProperty('--main', COLORS[upG]);
    document.getElementById('resultArea').style.display = 'block';
    
    // 显化卦象：增加“变爻”标识
    document.getElementById('resGua').innerHTML = `
        <div style="font-size: 0.8rem; opacity: 0.6;">初爻 · 至六爻</div>
        ${wisdom[upG].name} 之 ${wisdom[lowG].name}
        <div style="font-size: 12px; color: #ff4757;">第 ${changeYao} 爻动：其势必变</div>
    `;
    
    // 逻辑判定：增加“工业富联”与“DMD”等现代关键词的条件映射（即便没 API 也要显得懂行）
    let specialInsight = "";
    if(target.includes("股票") || target.includes("富联")) specialInsight = "【资本流向提示】：注意观察成交量与算力板块的耦合度。";
    if(target.includes("DMD") || target.includes("实验")) specialInsight = "【物理场域提示】：高频干扰项正在消解理论純度，需锁定相位。";

    document.getElementById('resJudge').innerText = 
        `${specialInsight}\n\n当前天时落入「${wisdom[upG].name}」。这意味着${wisdom[upG].essence} \n在此维度下，由于「${p}」的强介入，事物的原本运行轨迹正在发生 ${changeYao > 3 ? '向上' : '向下'} 的折射。`;

    // 风险与指引部分保持 V6.0 的高水准拼装...
    // (此处省略部分重复 UI 代码，逻辑已注入)
}
</script>
