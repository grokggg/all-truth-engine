<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V15.0 OUROBOROS | 衔尾蛇</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root { --bg: #000; --fg: #e0e0e0; --red: #ff3333; --blue: #00f3ff; --gold: #d4af37; --dim: #444; }
        body { background: var(--bg); color: var(--fg); font-family: "SF Mono", "Consolas", monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* 动态背景：衔尾蛇环 */
        .ring-bg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; height: 80vw; max-width: 600px; max-height: 600px;
            border: 1px dashed #222; border-radius: 50%; z-index: -1;
            animation: rotate 60s linear infinite;
        }
        .ring-bg::before { content: ""; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; background: var(--dim); border-radius: 50%; box-shadow: 0 0 20px var(--fg); }
        @keyframes rotate { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .console { width: 100%; max-width: 550px; background: rgba(10,10,10,0.95); border: 1px solid #333; padding: 30px; position: relative; overflow: hidden; }
        .console::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--red), var(--blue), var(--gold)); }

        h1 { font-size: 14px; letter-spacing: 4px; text-align: center; margin-bottom: 30px; color: #fff; text-transform: uppercase; }
        
        .input-group { position: relative; margin-bottom: 25px; }
        input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #555; padding: 10px; color: var(--gold); font-family: inherit; font-size: 16px; text-align: center; outline: none; }
        input:focus { border-color: var(--gold); }
        
        button { width: 100%; padding: 15px; background: #111; border: 1px solid #444; color: #888; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-size: 11px; transition: 0.3s; }
        button:hover { background: var(--gold); color: #000; border-color: var(--gold); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 结果面板 */
        #output { display: none; margin-top: 30px; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 卦象可视化 */
        .hexagram-box { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .hex-lines { display: flex; flex-direction: column-reverse; gap: 6px; width: 50px; } /* column-reverse 让初爻在最下 */
        .line { height: 4px; width: 100%; transition: 0.5s; }
        .yang { background: var(--gold); box-shadow: 0 0 5px var(--gold); }
        .yin { display: flex; justify-content: space-between; }
        .yin::before, .yin::after { content: ""; width: 42%; height: 100%; background: #555; }
        
        .hex-info { text-align: left; }
        .hex-name { font-size: 36px; font-weight: bold; line-height: 1; color: #fff; margin-bottom: 5px; }
        .hex-meaning { font-size: 12px; color: var(--gold); letter-spacing: 1px; }

        /* 深度分析卡片 */
        .card { margin-bottom: 20px; border-left: 2px solid #333; padding-left: 15px; position: relative; }
        .card-title { font-size: 10px; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; }
        .card-body { font-size: 13px; line-height: 1.7; color: #ccc; text-align: justify; }
        .highlight { color: #fff; border-bottom: 1px dotted #888; }
        
        .status-tag { padding: 2px 6px; font-size: 9px; border-radius: 2px; }
        .tag-red { background: rgba(255, 51, 51, 0.2); color: var(--red); border: 1px solid var(--red); }
        .tag-blue { background: rgba(0, 243, 255, 0.2); color: var(--blue); border: 1px solid var(--blue); }
        .tag-gold { background: rgba(212, 175, 55, 0.2); color: var(--gold); border: 1px solid var(--gold); }

        #log { font-size: 10px; color: #444; margin-top: 10px; min-height: 15px; text-align: center; font-style: italic; }
    </style>
</head>
<body>

<div class="ring-bg"></div>

<div class="console" id="captureTarget">
    <h1>V15.0 OUROBOROS <span>SYSTEM</span></h1>
    
    <div class="input-group">
        <input type="text" id="target" placeholder="输入观测奇点 (TARGET)">
    </div>
    <button onclick="runSystem()" id="btnRun">INITIATE DEEP SCAN</button>
    <div id="log">STANDBY...</div>

    <div id="output">
        <div class="hexagram-box">
            <div class="hex-lines" id="hexDraw"></div>
            <div class="hex-info">
                <div class="hex-name" id="hexName">--</div>
                <div class="hex-meaning" id="hexMean">CALCULATING...</div>
            </div>
        </div>

        <div class="card" style="border-color: var(--red);">
            <div class="card-title">
                <span>SEMANTIC FIELD // 语义底色</span>
                <span id="tagSem" class="status-tag">--</span>
            </div>
            <div class="card-body" id="txtSem"></div>
        </div>

        <div class="card" style="border-color: var(--blue);">
            <div class="card-title">
                <span>SYSTEM DYNAMICS // 动力结构</span>
                <span id="tagDyn" class="status-tag">--</span>
            </div>
            <div class="card-body" id="txtDyn"></div>
        </div>

        <div class="card" style="border-color: var(--gold);">
            <div class="card-title">
                <span>GAME MODEL // 博弈均衡</span>
                <span class="status-tag tag-gold">STRATEGY</span>
            </div>
            <div class="card-body" id="txtGame"></div>
        </div>
    </div>
</div>

<script>
const TAVILY_KEY = "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"; 

// 🧬 八卦基础元素 (Trigrams)
// key: 3-bit binary (Bottom -> Top)
const TRIGRAMS = {
    "111": { n: "乾", nature: "天", attr: "强健" },
    "000": { n: "坤", nature: "地", attr: "顺从" },
    "100": { n: "震", nature: "雷", attr: "震动" },
    "010": { n: "坎", nature: "水", attr: "险陷" },
    "001": { n: "艮", nature: "山", attr: "静止" },
    "101": { n: "离", nature: "火", attr: "附丽" },
    "110": { n: "兑", nature: "泽", attr: "喜悦" },
    "011": { n: "巽", nature: "风", attr: "入" }
};

// 🔮 64卦精准映射 (Hexagram Map) - 选取关键卦象
// Key: Upper(3) + Lower(3)
const HEX_MAP = {
    "010001": { n: "山水蒙", d: "启蒙 / 迷雾重重", t: "真相被层层掩盖，处于蒙昧未开之状态。" },
    "010010": { n: "坎为水", d: "重险 / 进退维谷", t: "险象环生，无论进退皆是深渊。" },
    "001010": { n: "水山蹇", d: "阻碍 / 寸步难行", t: "前方有险，后方有阻，难以突破。" },
    "101010": { n: "水火既济", d: "完成 / 盛极而衰", t: "事情已达定局，但这也意味着新的混乱开始。" },
    "010101": { n: "火水未济", d: "未成 / 循环往复", t: "彼岸未达，一切仍处于动态演变之中。" },
    "000000": { n: "坤为地", d: "承载 / 极度静默", t: "如大地般无声，包容一切罪恶与真相。" },
    "111111": { n: "乾为天", d: "运行 / 强力意志", t: "天道运行刚健，不以人的意志为转移。" },
    "100001": { n: "山雷颐", d: "养育 / 吞噬", t: "如口张开，祸从口出，亦通过吞噬维持生存。" }
};

async function log(msg) {
    document.getElementById('log').innerText = `>> ${msg}`;
    await new Promise(r => setTimeout(r, 300));
}

async function runSystem() {
    const target = document.getElementById('target').value;
    if(!target) return;
    
    document.getElementById('btnRun').disabled = true;
    document.getElementById('output').style.display = 'none';
    
    try {
        await log("ACCESSING GLOBAL DATASPHERE...");
        const response = await fetch('https://api.tavily.com/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ api_key: TAVILY_KEY, query: target, max_results: 5 })
        });
        const data = await response.json();
        const intel = data.results || [];
        const fullText = intel.map(i => i.content + i.title).join(" ");
        
        await log("PARSING SEMANTIC TOPOLOGY...");
        analyzeAndRender(target, fullText, intel);
        
        document.getElementById('output').style.display = 'block';
        await log("SYSTEM CYCLE COMPLETE.");

    } catch (e) {
        log("ERROR: CONNECTION SEVERED.");
    } finally {
        document.getElementById('btnRun').disabled = false;
    }
}

function analyzeAndRender(target, text, intel) {
    // 1. 语义场分析 (Semantic Field) - 修复情感误判
    // 引入「黑障词」逻辑：只要出现这些词，权重强制归零或负无穷
    const fatalWords = ["杀", "尸", "凶", "死", "罪", "毒", "血", "惨", "案"];
    const isFatal = fatalWords.some(w => text.includes(w));
    
    const posWords = ["成", "新", "高", "赢", "利", "顺"];
    const negWords = ["跌", "亏", "难", "阻", "危", "险"];
    
    let score = 0;
    posWords.forEach(w => { if(text.includes(w)) score++; });
    negWords.forEach(w => { if(text.includes(w)) score--; });
    
    // 如果触发黑障词，强制为极负面
    let semStatus = isFatal ? "CRITICAL / VOID" : (score >= 0 ? "POSITIVE / YANG" : "NEGATIVE / YIN");
    let semColor = isFatal ? "tag-red" : (score >= 0 ? "tag-blue" : "tag-red");
    
    document.getElementById('tagSem').className = `status-tag ${semColor}`;
    document.getElementById('tagSem').innerText = semStatus;
    
    document.getElementById('txtSem').innerHTML = isFatal 
        ? `检测到高危语义信标。对象「${target}」触犯了系统底层的生命伦理阈值。尽管可能存在“破案”等正面词汇，但其本体论底色为<span class="highlight">「大凶」</span>。`
        : `当前语义场呈现${score >= 0 ? '扩张' : '收缩'}态势。情报流中正负能量的交换比为 ${Math.abs(score)}:1。`;

    // 2. 卦象生成逻辑 (Trigram Stacking)
    // 下卦 (内因)：由事物本质决定。Fatal -> 水(险) 或 山(止)
    // 上卦 (外因)：由信息热度决定。热门 -> 火(明) 或 雷(动)；冷门 -> 地(暗) 或 山(止)
    
    // 简化的判定逻辑
    let lowerTriBin = ""; 
    if (isFatal) lowerTriBin = "010"; // 坎为水 (险)
    else if (score < 0) lowerTriBin = "001"; // 艮为山 (阻)
    else lowerTriBin = "111"; // 乾为天 (健)
    
    // 模拟热度 (这里用 snippet 长度简单模拟，实际可用时间戳)
    let upperTriBin = "";
    if (text.length > 2000) upperTriBin = "101"; // 离为火 (热)
    else upperTriBin = "001"; // 艮为山 (冷/止)

    const fullHexBin = upperTriBin + lowerTriBin; // 上卦 + 下卦
    
    // 渲染卦爻
    const drawBox = document.getElementById('hexDraw');
    drawBox.innerHTML = "";
    // 从初爻(最右/最下)开始画，CSS column-reverse 处理
    for(let char of fullHexBin.split("").reverse().join("")) { // fullHexBin 是 上->下，UI需要 下->上
        let l = document.createElement('div');
        l.className = `line ${char === '1' ? 'yang' : 'yin'}`;
        drawBox.appendChild(l);
    }
    
    // 查找或回退逻辑
    const hexData = HEX_MAP[fullHexBin] || { n: "变易之象", d: "混沌 / 演化中", t: "当前局势处于未定义的叠加态。" };
    document.getElementById('hexName').innerText = hexData.n;
    document.getElementById('hexMean').innerText = hexData.d;
    
    // 3. 系统动力学 & 博弈
    // 动力学描述
    const dynamics = isFatal 
        ? `系统处于<span class="highlight">「熵增停滞」</span>状态。信息虽然公开，但核心因果链条已断裂。观测锚点「${intel[0]?.title.substring(0,10)}...」证实了这种死寂的平衡。`
        : `系统表现为耗散结构，正通过与外部环境交换信息来维持自身有序。`;
    document.getElementById('txtDyn').innerHTML = dynamics;
    document.getElementById('tagDyn').innerText = isFatal ? "STAGNANT" : "DYNAMIC";
    document.getElementById('tagDyn').className = isFatal ? "status-tag tag-red" : "status-tag tag-blue";

    // 博弈描述
    const game = isFatal
        ? `这并非简单的囚徒困境，而是<span class="highlight">「非对称信息博弈 (Asymmetric Info Game)」</span>。持有真相的一方（X）处于完全隐身状态，而追索方（Public）处于全明状态。这导致纳什均衡点始终无法收敛，博弈将长期处于发散状态。`
        : `参与各方正处于正和博弈阶段，合作收益大于背叛成本。建议寻找帕累托最优解。`;
    document.getElementById('txtGame').innerHTML = game;
}
</script>
</body>
</html>
