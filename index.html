<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>万象森罗 V8.5.1 - 逻辑加固版</title>
    <style>
        :root { 
            --bg: #050505; 
            --card-bg: rgba(20, 20, 25, 0.9);
            --main: #b197fc; 
            --danger: #ff4757; 
            --success: #2ed573;
            --text-muted: #888;
        }
        body { background: var(--bg); color: #e0e0e0; font-family: "PingFang SC", "Segoe UI", serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 520px; width: 100%; position: relative; }
        .console-card { 
            background: var(--card-bg); border: 1px solid rgba(177, 151, 252, 0.2); 
            border-radius: 24px; padding: 25px; box-shadow: 0 0 50px rgba(0,0,0,0.8);
            backdrop-filter: blur(20px); position: relative; overflow: hidden;
        }
        .mode-switch {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 12px;
        }
        .switch-label { font-size: 14px; color: var(--text-muted); }
        .switch-btn {
            position: relative; width: 50px; height: 26px; background: #333; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .switch-btn::after {
            content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: 0.3s;
        }
        #cruelMode.active { background: var(--danger); }
        #cruelMode.active::after { left: 27px; }
        h1 { font-size: 1.5rem; text-align: center; letter-spacing: 4px; margin: 0 0 5px 0; background: linear-gradient(to right, #fff, var(--main)); -webkit-background-clip: text; color: transparent; }
        .status-bar { font-size: 10px; text-align: center; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 20px; }
        input[type="text"] { 
            width: 100%; padding: 16px; background: rgba(255,255,255,0.05); 
            border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 15px; 
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--main); box-shadow: 0 0 15px rgba(177, 151, 252, 0.15); }
        .launch-btn { 
            width: 100%; padding: 16px; margin-top: 15px;
            background: linear-gradient(135deg, #5830cc, #240046); 
            color: #fff; border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; font-weight: bold; cursor: pointer; 
            letter-spacing: 2px; transition: all 0.3s;
        }
        .launch-btn:hover { box-shadow: 0 0 20px rgba(88, 48, 204, 0.4); transform: translateY(-2px); }
        .launch-btn.cruel { background: linear-gradient(135deg, #cc3030, #5a0000); }
        .radar-container { display: none; margin: 20px auto; width: 100px; height: 100px; position: relative; }
        .radar-circle {
            width: 100%; height: 100%; border: 2px solid rgba(177,151,252,0.3); border-radius: 50%;
            position: absolute; box-shadow: 0 0 15px rgba(177,151,252,0.1) inset;
        }
        .radar-scan {
            width: 50%; height: 50%; background: linear-gradient(45deg, transparent 50%, rgba(177,151,252,0.8) 100%);
            position: absolute; top: 0; left: 0; transform-origin: 100% 100%;
            border-radius: 100% 0 0 0; animation: scan 2s infinite linear;
        }
        @keyframes scan { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .log-text { font-size: 12px; color: var(--main); text-align: center; margin-top: 10px; height: 20px; }
        #resultArea { display: none; margin-top: 25px; animation: fadeInUp 0.8s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .gua-clash { display: flex; justify-content: space-around; align-items: center; margin-bottom: 20px; }
        .gua-card { text-align: center; width: 45%; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 15px; }
        .gua-symbol { font-size: 50px; line-height: 1; margin-bottom: 5px; }
        .gua-name { font-size: 14px; font-weight: bold; }
        .gua-desc { font-size: 10px; color: #aaa; margin-top: 5px; }
        .balance-bar { height: 6px; background: #333; border-radius: 3px; margin: 15px 0; position: relative; overflow: hidden; }
        .balance-fill { height: 100%; background: var(--main); width: 0%; transition: width 1.5s ease-out; }
        .balance-text { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; }
        .factor-list { margin-top: 20px; border-top: 1px dashed #333; padding-top: 15px; }
        .factor-item { display: flex; align-items: flex-start; margin-bottom: 12px; font-size: 13px; line-height: 1.5; }
        .factor-icon { margin-right: 10px; font-size: 14px; }
        .factor-content { color: #ccc; }
        .cruel-tag { background: rgba(255, 71, 87, 0.2); color: var(--danger); padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-right: 5px; }
        #settingsPanel { display: none; background: #111; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px dashed #444; }
        .link-btn { color: #666; font-size: 11px; text-decoration: underline; cursor: pointer; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="console-card" id="mainCard">
        <h1>万象森罗 V8.5.1</h1>
        <div class="status-bar">CAUSAL ENGINE // REINFORCED</div>

        <div class="mode-switch">
            <div class="switch-label"><span id="modeText">🔵 标准推演模式</span></div>
            <div id="cruelMode" class="switch-btn" onclick="toggleMode()"></div>
        </div>

        <div id="settingsPanel">
            <input type="password" id="ds_key" placeholder="粘贴 DeepSeek API Key (sk-...)">
            <button onclick="saveKeys()" style="width:100%; padding:8px; margin-top:10px; background:#333; color:#fff; border:none; border-radius:8px;">💾 保存逻辑核心</button>
        </div>

        <input type="text" id="target" placeholder="🔮 输入观测目标 (如: DMD 4.8 实验成功率)">
        <button onclick="igniteEngine()" id="launchBtn" class="launch-btn">启动因果拆解</button>

        <div id="radarArea" class="radar-container">
            <div class="radar-circle"></div>
            <div class="radar-scan"></div>
            <div id="logText" class="log-text"></div>
        </div>

        <div id="resultArea">
            <div class="gua-clash">
                <div class="gua-card">
                    <div id="gua1_sym" class="gua-symbol" style="color:var(--main)"></div>
                    <div id="gua1_name" class="gua-name"></div>
                    <div class="gua-desc">现状 / 理论纯度</div>
                </div>
                <div style="font-size:20px; color:#555;">➤</div>
                <div class="gua-card">
                    <div id="gua2_sym" class="gua-symbol" style="color:var(--success)"></div>
                    <div id="gua2_name" class="gua-name"></div>
                    <div class="gua-desc">演化 / 现实坍缩</div>
                </div>
            </div>
            <div class="balance-text"><span>因果成功率</span><span id="probValue">0%</span></div>
            <div class="balance-bar"><div id="probFill" class="balance-fill"></div></div>
            <div id="factorList" class="factor-list"></div>
        </div>
        
        <div class="link-btn" onclick="toggleSettings()">⚙️ 配置密钥核心</div>
    </div>
</div>

<script>
const TAVILY_KEY = "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";
let isCruel = false;

window.onload = () => {
    if(!localStorage.getItem('ds_key')) document.getElementById('settingsPanel').style.display = 'block';
}

function toggleSettings() {
    const p = document.getElementById('settingsPanel');
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

function saveKeys() {
    const k = document.getElementById('ds_key').value;
    if(k.startsWith('sk-')) { localStorage.setItem('ds_key', k); alert("✅ 智核已加固"); toggleSettings(); }
    else alert("❌ 格式错误");
}

function toggleMode() {
    isCruel = !isCruel;
    const btn = document.getElementById('cruelMode');
    const txt = document.getElementById('modeText');
    const mainBtn = document.getElementById('launchBtn');
    btn.classList.toggle('active');
    txt.innerText = isCruel ? "🔴 冷酷对抗模式" : "🔵 标准推演模式";
    txt.style.color = isCruel ? "var(--danger)" : "var(--text-muted)";
    mainBtn.classList.toggle('cruel');
    document.querySelector('.radar-scan').style.background = isCruel ? 
        "linear-gradient(45deg, transparent 50%, rgba(255, 71, 87, 0.8) 100%)" : 
        "linear-gradient(45deg, transparent 50%, rgba(177, 151, 252, 0.8) 100%)";
}

async function igniteEngine() {
    const target = document.getElementById('target').value;
    const dsKey = localStorage.getItem('ds_key');
    if(!target || !dsKey) return alert("配置未完成");

    document.getElementById('resultArea').style.display = 'none';
    document.getElementById('radarArea').style.display = 'block';
    const btn = document.getElementById('launchBtn');
    const log = document.getElementById('logText');
    btn.disabled = true;

    try {
        log.innerText = "📡 检索全网熵增项...";
        const searchRes = await fetch('https://api.tavily.com/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ api_key: TAVILY_KEY, query: isCruel ? `${target} failure noise` : target, search_depth: "advanced" })
        }).then(r => r.json()).catch(() => ({results:[]}));

        const context = (searchRes.results || []).map(r => r.content).join("\n").substring(0, 2000);
        
        log.innerText = "🧠 智核因果拆解中...";
        const aiRes = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${dsKey}` },
            body: JSON.stringify({
                model: "deepseek-chat",
                messages: [
                    { role: "system", content: `你是一个因果引擎。必须仅返回JSON：{"gua1_sym":"","gua1_name":"","gua2_sym":"","gua2_name":"","probability":0,"factors":[{"type":"risk/positive","content":""}]}` },
                    { role: "user", content: `目标:${target}\n背景:${context}\n模式:${isCruel?'冷酷':'标准'}` }
                ],
                temperature: isCruel ? 0.3 : 1.0
            })
        });

        const aiData = await aiRes.json();
        if(!aiData.choices || !aiData.choices[0]) throw new Error("智核未响应，请检查Key余额或网络");

        let raw = aiData.choices[0].message.content.replace(/```json/gi, "").replace(/```/gi, "").trim();
        const data = JSON.parse(raw);

        // 渲染
        document.getElementById('gua1_sym').innerText = data.gua1_sym;
        document.getElementById('gua1_name').innerText = data.gua1_name;
        document.getElementById('gua2_sym').innerText = data.gua2_sym;
        document.getElementById('gua2_name').innerText = data.gua2_name;
        document.getElementById('probValue').innerText = data.probability + "%";
        document.getElementById('probFill').style.width = data.probability + "%";
        
        const list = document.getElementById('factorList');
        list.innerHTML = "";
        data.factors.forEach(f => {
            const item = document.createElement('div');
            item.className = "factor-item";
            const tag = (isCruel && f.type==='risk') ? '<span class="cruel-tag">耗散</span>' : '';
            item.innerHTML = `<span class="factor-icon">${f.type==='risk'?'🔻':'🔺'}</span><div class="factor-content">${tag}${f.content}</div>`;
            list.appendChild(item);
        });

        document.getElementById('resultArea').style.display = 'block';
    } catch (err) {
        alert("🚨 硅基演化中断：\n" + err.message);
    } finally {
        document.getElementById('radarArea').style.display = 'none';
        btn.disabled = false;
    }
}
</script>
</body>
</html>
