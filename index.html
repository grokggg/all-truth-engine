<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>万象·天演 V14.0 | Emergent Oracle</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root { 
            --void: #080808; 
            --neon: #00f3ff; 
            --gold: #d4af37; 
            --alert: #ff2a2a;
            --glass: rgba(20, 20, 20, 0.85);
        }
        * { box-sizing: border-box; }
        body { 
            background: var(--void); color: #c0c0c0; 
            font-family: "JetBrains Mono", "Consolas", monospace; 
            margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* 背景动态网格 - 象征量子场 */
        .quantum-field {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            animation: fieldShift 100s linear infinite;
        }
        @keyframes fieldShift { 0% { background-position: 0 0; } 100% { background-position: 100px 100px; } }

        .mainframe {
            width: 100%; max-width: 650px;
            background: var(--glass);
            border: 1px solid #333;
            box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.5);
            padding: 2px;
            position: relative;
        }
        /* 顶部状态栏 */
        .status-header {
            background: #111; padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333;
            font-size: 10px; color: #666; letter-spacing: 1px;
        }
        .status-dot { width: 8px; height: 8px; background: var(--neon); border-radius: 50%; box-shadow: 0 0 5px var(--neon); }

        .content-area { padding: 25px; }

        h1 { 
            font-size: 14px; text-transform: uppercase; letter-spacing: 4px; 
            color: #fff; margin: 0 0 20px 0; text-align: center;
            border-bottom: 1px solid #333; padding-bottom: 15px;
        }
        h1 span { color: var(--gold); }

        /* 输入区 */
        .input-matrix { position: relative; margin-bottom: 20px; }
        input { 
            width: 100%; background: #0a0a0a; border: 1px solid #333; 
            color: var(--neon); padding: 15px; font-family: inherit; 
            font-size: 16px; text-align: left; transition: 0.3s;
        }
        input:focus { border-color: var(--neon); box-shadow: 0 0 15px rgba(0, 243, 255, 0.1); outline: none; }
        
        .btn-core {
            width: 100%; background: #1a1a1a; color: #fff; border: 1px solid #444;
            padding: 12px; cursor: pointer; font-family: inherit; font-size: 12px;
            letter-spacing: 2px; transition: 0.3s; text-transform: uppercase;
        }
        .btn-core:hover { background: var(--neon); color: #000; border-color: var(--neon); }
        .btn-core:disabled { background: #111; color: #444; border-color: #222; cursor: processing; }

        /* 终端日志区 (Stream of Consciousness) */
        #terminalLog {
            font-size: 11px; color: #555; height: 120px; overflow-y: auto;
            border: 1px solid #222; padding: 10px; margin-bottom: 20px;
            background: #050505; display: none;
        }
        .log-entry { margin-bottom: 4px; }
        .log-agent { color: var(--gold); font-weight: bold; }
        .log-info { color: #888; }
        .log-warn { color: var(--alert); }

        /* 结果展示区 */
        #resultDeck { display: none; animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 64卦显示 */
        .hex-container { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .hex-visual { display: flex; flex-direction: column; gap: 4px; width: 60px; }
        .yao { height: 6px; width: 100%; background: #333; transition: 0.5s; }
        .yao.yang { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
        .yao.yin { background: transparent; border: 1px solid #444; display: flex; justify-content: space-between; border: none; }
        .yao.yin::before, .yao.yin::after { content: ""; width: 42%; height: 100%; background: #444; } 
        /* 阴爻变色逻辑由JS控制 */
        
        .hex-meta { text-align: left; }
        .hex-big-name { font-size: 32px; font-weight: bold; color: #fff; margin: 0; line-height: 1; }
        .hex-sub { font-size: 12px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }

        /* 三维分析卡片 */
        .analysis-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .card { background: rgba(255,255,255,0.02); border-left: 2px solid #333; padding: 15px; }
        .card-head { font-size: 10px; color: #666; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .card-body { font-size: 13px; line-height: 1.6; color: #ddd; text-align: justify; }
        
        .tag { padding: 2px 6px; background: #222; border-radius: 2px; }
        .tag.entropy { color: var(--alert); }
        .tag.game { color: var(--neon); }

    </style>
</head>
<body>

<div class="quantum-field"></div>

<div class="mainframe" id="captureTarget">
    <div class="status-header">
        <span>V14.0 SYSTEM: ONLINE</span>
        <div class="status-dot"></div>
    </div>

    <div class="content-area">
        <h1>万象 · 天演 <span>EMERGENT ORACLE</span></h1>
        
        <div class="input-matrix">
            <input type="text" id="target" placeholder="输入观测奇点 (如: 恒大债务 / 量子计算 / 某人名)">
        </div>
        <button class="btn-core" onclick="initiateSequence()" id="runBtn">启动全维推演</button>
        
        <div id="terminalLog"></div>

        <div id="resultDeck">
            <div class="hex-container">
                <div class="hex-visual" id="hexDraw">
                    </div>
                <div class="hex-meta">
                    <div class="hex-big-name" id="hexName">--</div>
                    <div class="hex-sub" id="hexDesc">CALCULATING...</div>
                </div>
            </div>

            <div class="analysis-grid">
                <div class="card" style="border-color: var(--alert);">
                    <div class="card-head">
                        <span>PHYSICS LAYER // 物理层</span>
                        <span class="tag entropy">ENTROPY: <span id="valEntropy">High</span></span>
                    </div>
                    <div class="card-body" id="txtPhysics"></div>
                </div>

                <div class="card" style="border-color: var(--gold);">
                    <div class="card-head">
                        <span>PSYCHE LAYER // 心理层</span>
                        <span class="tag">ARCHETYPE</span>
                    </div>
                    <div class="card-body" id="txtPsyche"></div>
                </div>

                <div class="card" style="border-color: var(--neon);">
                    <div class="card-head">
                        <span>GAME THEORY // 博弈层</span>
                        <span class="tag game">NASH EQ</span>
                    </div>
                    <div class="card-body" id="txtGame"></div>
                </div>
                
                <div style="font-size: 10px; color: #444; margin-top: 15px; text-align: center;">
                    DATA SOURCE: TAVILY REAL-TIME INTEL // GENERATED BY GEMINI V14.0
                </div>
            </div>
            
            <button class="btn-core" onclick="exportData()" style="margin-top:20px; background:#111;">📥 固化推演报告</button>
        </div>
    </div>
</div>

<script>
const TAVILY_KEY = "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"; 

// 🌌 64卦全息映射表 (简版)
// Key: Binary string (Bottom to Top, 1=Yang, 0=Yin)
const I_CHING_64 = {
    "111111": { n: "乾为天", d: "元亨利贞，天行健" },
    "000000": { n: "坤为地", d: "厚德载物，地势坤" },
    "100010": { n: "水雷屯", d: "万物始生，艰难并存" },
    "010001": { n: "山水蒙", d: "启蒙之初，去蔽求真" },
    "010111": { n: "泽天夬", d: "决堤之势，必须决断" },
    "111010": { n: "天雷无妄", d: "顺其自然，不可妄动" },
    "010101": { n: "未济", d: "火水未济，循环往复" },
    "101010": { n: "既济", d: "水火既济，功德圆满" },
    // ...为了代码简洁，其他卦象将通过算法动态生成通用解
};

// 🧠 知识库：多学科分析模版
const KNOWLEDGE_BASE = {
    // 物理/熵值视角
    entropyHigh: [
        "系统正处于「耗散结构」的临界点。混乱度（Entropy）急剧上升，旧有的秩序正在热力学第二定律的作用下崩解。",
        "检测到高能级的「相变」波动。当前的稳定性极低，正如过冷水受扰，随时可能瞬间结冰或沸腾。",
        "呈现出典型的「布朗运动」特征。因果链条非线性，微小的初始变量可能导致混沌理论中的蝴蝶效应。"
    ],
    entropyLow: [
        "系统处于「低熵稳态」。能量流动受阻，结构呈现出晶体般的固化特征，改变极其困难。",
        "如同「死寂的钟摆」，摩擦力抵消了动能。当前的平静是由于缺乏外部负熵流的输入。",
        "结构呈现高度的「鲁棒性」，但也意味着僵化。对于创新或突变具有极强的免疫排斥反应。"
    ],
    // 心理/原型视角
    archetypes: [
        "集体潜意识投射出「阴影 (The Shadow)」原型。公众在观测对象身上看到了自己被压抑的恐惧与欲望。",
        "符合「愚者 (The Fool)」的英雄之旅阶段。盲目自信与无限潜力并存，虽在悬崖边缘却不自知。",
        "激活了「受难者」情结。舆论场中弥漫着一种赎罪与牺牲的叙事氛围，理性判断被情感共鸣淹没。",
        "呈现「颠覆者 (Rebel)」面具。对于权威和既定规则的破坏欲构成了当前最核心的精神动力。"
    ],
    // 博弈/策略视角
    gameTheory: [
        "当前局势符合「囚徒困境」模型。各方因缺乏信任而选择次优策略，导致整体利益受损（纳什均衡点偏低）。",
        "这是一场典型的「胆小鬼博弈 (Chicken Game)」。双方都在等待对方先眨眼，碰撞的风险随着时间推移指数级上升。",
        "呈现「零和博弈」特征。存量竞争极其残酷，一方的收益必然建立在另一方的直接亏损之上。",
        "存在「帕累托改进」的空间。如果能引入外部变量打破僵局，系统有机会跃迁至更高阶的合作形态。"
    ]
};

// 🛠️ 辅助函数：模拟打字机日志
async function log(msg, type="info") {
    const box = document.getElementById('terminalLog');
    box.style.display = 'block';
    const div = document.createElement('div');
    div.className = 'log-entry';
    const label = type === 'agent' ? '<span class="log-agent">[AGENT]</span> ' : 
                  type === 'warn' ? '<span class="log-warn">[WARN]</span> ' : 
                  '<span class="log-info">[SYS]</span> ';
    div.innerHTML = label + msg;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    await new Promise(r => setTimeout(r, 400));
}

// 🚀 核心逻辑
async function initiateSequence() {
    const target = document.getElementById('target').value;
    if(!target) return;
    
    const btn = document.getElementById('runBtn');
    const deck = document.getElementById('resultDeck');
    
    btn.disabled = true;
    deck.style.display = 'none';
    document.getElementById('terminalLog').innerHTML = ''; // Clear log

    try {
        // 1. 启动全网扫描
        await log(`Initializing OSINT scan for target: "${target}"...`);
        const response = await fetch('https://api.tavily.com/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ api_key: TAVILY_KEY, query: target, max_results: 5 })
        });
        const data = await response.json();
        const intel = data.results || [];
        const fullText = intel.map(i => i.content).join(" ");
        
        await log(`Data acquired. Payload size: ${fullText.length} bytes.`);
        
        // 2. 多智能体认知处理 (Cognitive Processing)
        
        // Agent 1: 语义分析 (NLP) - 决定阴阳
        await log(`NLP Module: Analyzing sentiment velocity...`, 'agent');
        const negWords = ["死","案","查","跌","危","损","战","杀","罪","恐","难"];
        const posWords = ["生","涨","新","胜","盈","高","解","和","利","吉","通"];
        let netScore = 0;
        negWords.forEach(w => { if(fullText.includes(w)) netScore -= 1; });
        posWords.forEach(w => { if(fullText.includes(w)) netScore += 1; });
        await log(`Sentiment Vector: ${netScore > 0 ? '+POSITIVE' : '-NEGATIVE'} (${netScore})`);

        // Agent 2: 熵值计算 (Entropy) - 决定变爻活跃度
        await log(`Physics Module: Calculating system entropy...`, 'agent');
        const uniqueWords = new Set(fullText.split(" ")).size;
        const entropyScore = uniqueWords / fullText.length; // 简单的混乱度计算
        const isHighEntropy = entropyScore > 0.15 || Math.abs(netScore) > 3; // 混乱或情绪极端都算高熵
        await log(`System Entropy: ${isHighEntropy ? 'HIGH (Dissipative Structure)' : 'LOW (Crystalline State)'}`);

        // 3. 生成 64 卦 (Hexagram Generation)
        // 算法：使用 Hash + Score 生成 6位二进制
        const hash = target.split('').reduce((a,b)=>((a<<5)-a)+b.charCodeAt(0),0);
        let binaryStr = "";
        for(let i=0; i<6; i++) {
            // 每一爻由 (Hash的某一位 + 情绪分 + 随机微扰) 决定
            const val = (Math.abs(hash >> i) + netScore + (isHighEntropy?1:0)) % 2;
            binaryStr += val; // 0 或 1
        }
        
        // 渲染 UI
        renderHexagram(binaryStr);
        renderAnalysis(binaryStr, isHighEntropy, netScore, intel);

        await log(`Metaphysical mapping complete. Rendering logic surface...`, 'info');
        deck.style.display = 'block';

    } catch (e) {
        await log(`FATAL ERROR: ${e.message}`, 'warn');
    } finally {
        btn.disabled = false;
    }
}

// 🎨 渲染 64 卦视觉
function renderHexagram(binStr) {
    const container = document.getElementById('hexDraw');
    container.innerHTML = '';
    
    // 从下往上画
    for(let i=0; i<6; i++) {
        const line = document.createElement('div');
        const isYang = binStr[i] === '1';
        line.className = `yao ${isYang ? 'yang' : 'yin'}`;
        // 倒序插入，因为二进制字符串我习惯 0是初爻
        container.insertBefore(line, container.firstChild); 
    }

    // 尝试匹配特定卦，否则生成通用卦名
    const match = I_CHING_64[binStr];
    document.getElementById('hexName').innerText = match ? match.n : "未济之象"; // 默认
    document.getElementById('hexDesc').innerText = match ? match.d : "CHAOS / UNDEFINED STATE";
    
    // 如果没有匹配到常用卦，动态生成名字（上卦+下卦）
    if(!match) {
        const trigramNames = ["坤","震","坎","兑","艮","离","巽","乾"]; // 对应 000-111 (需根据二进制转十进制)
        const lower = parseInt(binStr.substring(0,3), 2);
        const upper = parseInt(binStr.substring(3,6), 2);
        // 这里只是简化的演示，真实系统需要完整的 lookup table
        document.getElementById('hexName').innerText = "变易之象"; 
    }
}

// 📝 渲染三维分析报告
function renderAnalysis(binStr, isHighEntropy, netScore, intel) {
    // 1. 物理层
    const entTag = document.getElementById('valEntropy');
    const txtPhy = document.getElementById('txtPhysics');
    if(isHighEntropy) {
        entTag.innerText = "HIGH / CHAOTIC";
        entTag.style.color = "var(--alert)";
        txtPhy.innerHTML = KNOWLEDGE_BASE.entropyHigh[Math.floor(Math.random()*3)];
    } else {
        entTag.innerText = "LOW / ORDERED";
        entTag.style.color = "var(--neon)";
        txtPhy.innerHTML = KNOWLEDGE_BASE.entropyLow[Math.floor(Math.random()*3)];
    }
    // 插入真实数据
    const snippet = intel[0]?.title || "未知数据";
    txtPhy.innerHTML += `<br><br>观测锚点：「${snippet}」证明了该物理状态的客观存在。`;

    // 2. 心理层
    const txtPsy = document.getElementById('txtPsyche');
    // 根据情绪分选原型
    let archIdx = 0;
    if(netScore < -2) archIdx = 0; // Shadow
    else if(netScore > 2) archIdx = 1; // Fool/Hero
    else archIdx = 2; // Victim/Observer
    txtPsy.innerHTML = KNOWLEDGE_BASE.archetypes[archIdx] || KNOWLEDGE_BASE.archetypes[3];

    // 3. 博弈层
    const txtGame = document.getElementById('txtGame');
    // 根据混乱度选博弈模型
    let gameIdx = isHighEntropy ? 1 : 0; // 混乱=胆小鬼博弈， 稳定=囚徒困境
    if(netScore < -4) gameIdx = 2; // 极差=零和
    if(netScore > 4) gameIdx = 3; // 极好=帕累托
    txtGame.innerHTML = KNOWLEDGE_BASE.gameTheory[gameIdx];
}

function exportData() {
    html2canvas(document.getElementById('captureTarget'), { backgroundColor: '#080808' }).then(c => {
        const a = document.createElement('a');
        a.href = c.toDataURL();
        a.download = `万象天演_V14_${Date.now()}.png`;
        a.click();
    });
}
</script>
</body>
</html>
