<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V16.0 AXIOM | 公理化推演终端</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root { --accent: #00ff9d; --bg: #050505; --panel: #111111; --text: #d0d0d0; --warn: #ff4d4d; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: "IBM Plex Mono", "Courier New", monospace; margin: 0; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .axiom-console { width: 100%; max-width: 600px; background: var(--panel); border: 1px solid #222; position: relative; padding: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
        .axiom-console::before { content: "TOP SECRET // AXIOM V16.0"; position: absolute; top: 10px; left: 10px; font-size: 8px; color: #444; }

        .input-zone { border-bottom: 2px solid #333; margin-bottom: 30px; padding-bottom: 10px; display: flex; align-items: center; }
        .input-zone span { color: var(--accent); margin-right: 15px; font-weight: bold; }
        input { background: transparent; border: none; color: #fff; font-size: 20px; width: 100%; outline: none; font-family: inherit; }

        .btn-exe { background: #fff; color: #000; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; width: 100%; }
        .btn-exe:hover { background: var(--accent); }

        #process { margin-top: 20px; font-size: 11px; color: #666; display: none; }
        
        /* 结果展示 */
        #result { display: none; margin-top: 40px; border-top: 1px solid #222; padding-top: 30px; }

        /* 卦象张量 */
        .tensor-gua { display: flex; gap: 30px; align-items: center; margin-bottom: 40px; }
        .gua-symbol { width: 60px; display: flex; flex-direction: column-reverse; gap: 6px; }
        .bar { height: 5px; background: #333; }
        .bar.yang { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .bar.yin { display: flex; justify-content: space-between; background: transparent; }
        .bar.yin::before, .bar.yin::after { content: ""; width: 42%; height: 100%; background: #555; }

        .gua-meta h2 { margin: 0; font-size: 32px; color: #fff; letter-spacing: 4px; }
        .gua-meta p { margin: 5px 0 0; font-size: 12px; color: var(--accent); text-transform: uppercase; }

        /* 学科卡片 */
        .axiom-card { margin-bottom: 25px; }
        .label { font-size: 9px; color: #555; margin-bottom: 10px; letter-spacing: 2px; display: flex; align-items: center; }
        .label::after { content: ""; flex: 1; height: 1px; background: #222; margin-left: 10px; }
        .val { font-size: 14px; line-height: 1.8; color: #aaa; }
        .highlight { color: #fff; font-weight: bold; }

        .status-pill { padding: 2px 8px; border-radius: 10px; font-size: 9px; margin-left: 10px; }
        .pill-active { background: rgba(0,255,157,0.1); color: var(--accent); border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div class="axiom-console" id="captureTarget">
    <div class="input-zone">
        <span>&gt;</span>
        <input type="text" id="target" placeholder="ENTER TARGET...">
    </div>
    <button class="btn-exe" onclick="runAxiom()">Execute Analysis</button>
    <div id="process"></div>

    <div id="result">
        <div class="tensor-gua">
            <div class="gua-symbol" id="symbol"></div>
            <div class="gua-meta">
                <h2 id="name">--</h2>
                <p id="sub">--</p>
            </div>
        </div>

        <div class="axiom-card">
            <div class="label">DOMAIN CLASSIFIER <span class="status-pill pill-active" id="domainTag">GENERAL</span></div>
            <div class="val" id="classification">...</div>
        </div>

        <div class="axiom-card">
            <div class="label">THERMODYNAMICS // 熵流分析</div>
            <div class="val" id="thermo">...</div>
        </div>

        <div class="axiom-card">
            <div class="label">GAME THEORY // 冲突解构</div>
            <div class="val" id="game">...</div>
        </div>

        <div class="axiom-card">
            <div class="label">AXIOM JUDGEMENT // 终极判定</div>
            <div class="val highlight" id="judgement">...</div>
        </div>
    </div>
</div>

<script>
const TAVILY_KEY = "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";

async function log(msg) {
    const p = document.getElementById('process');
    p.style.display = 'block';
    p.innerText = `[LOG] ${msg}`;
    await new Promise(r => setTimeout(r, 400));
}

async function runAxiom() {
    const t = document.getElementById('target').value;
    if(!t) return;
    
    await log("Accessing multi-source data streams...");
    try {
        const response = await fetch('https://api.tavily.com/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ api_key: TAVILY_KEY, query: t, search_depth: "basic" })
        });
        const data = await response.json();
        const content = data.results.map(r => r.content + r.title).join(" ");
        
        await log("Activating Tensor Logic processors...");
        analyze(t, content, data.results);
        
        document.getElementById('result').style.display = 'block';
    } catch(e) {
        alert("STREAM INTERRUPTED.");
    }
}

function analyze(target, text, raw) {
    // 1. 领域分流系统 (Domain Shunt)
    let domain = "GENERAL";
    if (/(案|凶|杀|罪|刑|死)/.test(text)) domain = "CRIMINAL";
    else if (/(股|市|营收|制造|热管理|研发|技术)/.test(text)) domain = "INDUSTRIAL";
    
    document.getElementById('domainTag').innerText = domain;

    // 2. 逻辑张量计算
    const isCrim = domain === "CRIMINAL";
    const isInd = domain === "INDUSTRIAL";

    // 卦象生成 (修正逻辑：刑事案强制下卦为坎水, 工业案下卦为震雷或乾天)
    let lower = isCrim ? "010" : (isInd ? "100" : "111");
    let upper = text.length > 1500 ? "101" : "001"; // 热度：火 or 山
    const hexBin = upper + lower;

    // 渲染
    const sym = document.getElementById('symbol');
    sym.innerHTML = "";
    hexBin.split("").reverse().forEach(b => {
        const d = document.createElement('div');
        d.className = `bar ${b === '1' ? 'yang' : 'yin'}`;
        sym.appendChild(d);
    });

    // 映射 64 卦名 (示例两个最典型的)
    const map = {
        "101010": {n: "既济", s: "PERFECTION / 终结"},
        "001010": {n: "蹇卦", s: "OBSTACLE / 险阻"},
        "101100": {n: "噬嗑", s: "BITING / 刑罚"},
        "001100": {n: "颐卦", s: "NOURISH / 闭环"}
    };
    const res = map[hexBin] || {n: "变异之象", s: "FLUX"};
    document.getElementById('name').innerText = res.n;
    document.getElementById('sub').innerText = res.s;

    // 3. 深度内容生成 (拒绝模版，根据领域强制重写)
    if (isCrim) {
        document.getElementById('classification').innerText = `目标被归类为「不可逆熵增刑事奇点」。此类案件特征在于因果律在特定时间点坍塌。`;
        document.getElementById('thermo').innerText = `物理层表现为「冷寂状态」。信息虽在社会网络中低频震荡，但物质层面的能量交换早已停止，真相处于绝对零度。`;
        document.getElementById('game').innerText = `博弈逻辑属于「非对称追逃博弈 (Asymmetric Pursuit)」。凶手通过隐匿实现了博弈的主动权锁定，而侦察方处于“寻找概率云”的被动状态，纳什均衡点不存在。`;
        document.getElementById('judgement').innerText = `【终极判定】：这是一场跨越时空的因果博弈，由于初期变量丢失，真相的坍缩取决于未来观测技术的跨维度介入。`;
    } else {
        document.getElementById('classification').innerText = `目标被归类为「高熵增值工业实体」。其核心价值在于对物理环境（温控/能效）的负熵干预。`;
        document.getElementById('thermo').innerText = `系统处于「有序开放态」。通过研发投入（能量输入）换取技术壁垒（负熵），在激烈的市场竞争中构建结构性的稳态。`;
        document.getElementById('game').innerText = `博弈逻辑属于「动态斯塔克尔伯格竞争 (Stackelberg Competition)」。作为细分领军者，该实体拥有先行者优势，正通过技术迭代对追随者进行策略挤压。`;
        document.getElementById('judgement').innerText = `【终极判定】：该实体正处于从“结构化生存”向“跨代际超越”的节点，关键变量在于上游供应链的扰动。`;
    }
}
</script>
</body>
</html>
