<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V17.0 NOOSPHERE | 全息知性网</title>
    <style>
        /* ═══════════════════════════════════════════════
           NOOSPHERE V17.0 — VISUAL CORE
           Cyberpunk Dark Aesthetic · Holographic
           ═══════════════════════════════════════════════ */
        :root {
            --main: #00e5ff;
            --main-dim: rgba(0, 229, 255, 0.1);
            --bg: #030305;
            --card: #0a0b10;
            --border: #1a1c25;
            --text: #a0a0b0;
            --gold: #ffd700;
            --red: #ff2d55;
            --scan-line: rgba(0, 229, 255, 0.03);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Holographic Grid Substrate ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                linear-gradient(rgba(18, 20, 31, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18, 20, 31, 0.5) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .node-container {
            width: 100%;
            max-width: 700px;
            background: var(--card);
            border: 1px solid var(--border);
            padding: clamp(20px, 5vw, 40px);
            border-radius: 4px;
            position: relative;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
            margin: 15px;
            overflow: hidden;
        }

        /* Scanline Overlay */
        .node-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .header { text-align: center; margin-bottom: 30px; position: relative; z-index: 3; }
        .header h1 {
            font-size: clamp(24px, 6vw, 36px);
            color: var(--main);
            text-shadow: 0 0 15px var(--main-dim), 0 0 30px var(--main);
            letter-spacing: 4px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        .header p { color: var(--gold); font-size: 10px; letter-spacing: 6px; text-transform: uppercase; opacity: 0.8; }

        /* ── Input Bay ── */
        .search-bay { position: relative; margin-bottom: 25px; z-index: 10; }
        input[type="text"] {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-left: 2px solid var(--main);
            color: #fff;
            font-size: 16px;
            width: 100%;
            padding: 15px 20px;
            outline: none;
            transition: all 0.3s;
            font-family: 'Courier New', Courier, monospace;
        }
        input[type="text"]:focus {
            background: rgba(0, 229, 255, 0.05);
            box-shadow: 0 0 20px var(--main-dim);
        }

        /* ── Action Button ── */
        .core-btn {
            background: var(--main);
            color: #000;
            border: none;
            padding: 16px;
            width: 100%;
            font-weight: 900;
            cursor: pointer;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 0 15px var(--main-dim);
        }
        .core-btn:hover { background: #fff; box-shadow: 0 0 30px var(--main); transform: translateY(-2px); }
        .core-btn:active { transform: translateY(0); }
        .core-btn:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

        #log-stream {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: var(--text);
            text-align: center;
            min-height: 20px;
            margin-top: 15px;
            opacity: 0.7;
        }

        /* ── Display Gate (Results) ── */
        #display-gate { display: none; margin-top: 30px; position: relative; z-index: 5; }
        
        /* SVG Hexagram Container */
        .gua-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 8px var(--main));
        }
        
        /* The Yao (Line) Animation - Bottom to Top */
        .yao-rect {
            fill: var(--main);
            opacity: 0;
            transform-origin: center;
            transform: scaleX(0);
        }
        .gua-active .yao-rect {
            animation: holoScan 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        
        /* Staggered animation for 6 lines (bottom is index 0 in SVG group usually, but we order visually) */
        .gua-active .yao-rect:nth-child(6) { animation-delay: 0.1s; } /* Bottom Line */
        .gua-active .yao-rect:nth-child(5) { animation-delay: 0.2s; }
        .gua-active .yao-rect:nth-child(4) { animation-delay: 0.3s; }
        .gua-active .yao-rect:nth-child(3) { animation-delay: 0.4s; }
        .gua-active .yao-rect:nth-child(2) { animation-delay: 0.5s; }
        .gua-active .yao-rect:nth-child(1) { animation-delay: 0.6s; } /* Top Line */

        @keyframes holoScan {
            0% { opacity: 0; transform: scaleX(0); filter: brightness(2); }
            50% { opacity: 1; transform: scaleX(1.1); filter: brightness(1.5); }
            100% { opacity: 0.9; transform: scaleX(1); filter: brightness(1); }
        }

        .gua-meta { text-align: center; margin-bottom: 30px; }
        .gua-meta h2 { color: #fff; font-size: 24px; font-weight: 300; letter-spacing: 5px; margin: 0; }
        .gua-meta span { font-size: 10px; color: var(--gold); border: 1px solid var(--gold); padding: 2px 8px; border-radius: 10px; text-transform: uppercase; margin-top: 5px; display: inline-block; }

        /* Insight Cards */
        .insight-card {
            background: rgba(255,255,255,0.02);
            border-left: 2px solid var(--main);
            padding: 15px 20px;
            margin-bottom: 15px;
            transform: translateX(-10px);
            opacity: 0;
            transition: all 0.5s ease;
        }
        .insight-card.reveal { transform: translateX(0); opacity: 1; }
        .insight-card h3 { color: var(--main); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .insight-card p { font-size: 14px; line-height: 1.6; color: #ccc; }

        .loading-bar {
            height: 2px; width: 0%; background: var(--main);
            position: absolute; top: 0; left: 0;
            box-shadow: 0 0 10px var(--main);
            transition: width 0.3s;
        }

        /* ── Response to high-res screens ── */
        @media (-webkit-min-device-pixel-ratio: 2) {
            .node-container { border-width: 0.5px; }
        }
    </style>
</head>
<body>

<div class="node-container">
    <div class="loading-bar" id="load-bar"></div>
    
    <div class="header">
        <h1>⬢ NOOSPHERE V17.0</h1>
        <p>HOLOGRAPHIC COGNITION MATRIX</p>
    </div>

    <div class="search-bay">
        <input type="text" id="target" placeholder="INIT_QUERY_VECTOR..." autocomplete="off" spellcheck="false">
    </div>

    <button class="core-btn" id="analyze-btn">⬡ RUN ENGINE</button>
    <div id="log-stream">System Standby</div>

    <div id="display-gate">
        <div class="gua-container" id="gua-mount"></div>

        <div class="gua-meta">
            <h2 id="gua-name"></h2>
            <span id="domain-badge"></span>
        </div>

        <div class="insight-card" id="card-phys">
            <h3>◇ Entropy & Phase State</h3>
            <p id="p-phys"></p>
        </div>
        
        <div class="insight-card" id="card-game">
            <h3>◇ Strategic Game Theory</h3>
            <p id="p-game"></p>
        </div>

        <div class="insight-card" id="card-final">
            <h3>◇ Synthesis</h3>
            <p id="p-final" style="color: #fff; font-weight: 600;"></p>
        </div>
    </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   NOOSPHERE V17.0 — CORE LOGIC
   Architect: Claude 4.6 (Simulation)
   ═══════════════════════════════════════════════════════ */

// §1 API CLIENT (Async + Abort Control)
class APIClient {
    constructor() {
        this.endpoint = 'https://api.tavily.com/search';
        // DEV KEY PROVIDED IN PROMPT
        this.key = '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';
    }

    async search(query) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000); // 10s Timeout

        try {
            const res = await fetch(this.endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    api_key: this.key,
                    query: query,
                    search_depth: 'basic',
                    max_results: 5,
                    include_answer: true
                }),
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            
            if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
            return await res.json();
        } catch (error) {
            clearTimeout(timeoutId);
            throw error;
        }
    }
}

// §2 NOOSPHERE BRAIN (Logic Core)
class Noosphere {
    
    /**
     * 语义场隔绝 (Semantic Isolation) - 升维版
     * 引入负向触发权重，防止语义漂移
     */
    classifyDomain(content) {
        const text = (content || "").toLowerCase();

        // 1. 定义特征向量 (Feature Vectors)
        let weights = {
            CRIMINAL: (text.match(/案|凶|罪|刑|死|杀|捕|狱|警/g) || []).length * 2,
            INDUSTRIAL: (text.match(/制造|研发|技术|液冷|热管理|产能|储能|光伏|电池|工厂|良率/g) || []).length * 3, // 提高工业权重
            FINANCE: (text.match(/股|涨|跌|资金|财报|营收|利润|市值的|投资/g) || []).length * 2,
            TECHNOLOGY: (text.match(/算法|ai|代码|硬件|数据|芯片|服务器|云端/g) || []).length * 2
        };

        // 2. 负向触发防火墙 (Negative Trigger Firewall)
        // 任何包含纯技术/金融术语的上下文，必须物理切断刑事关联
        const antiCriminalMemes = /液冷|散热|a股|算力|英维克|宁德时代|比亚迪|服务器|基站/i;
        
        if (antiCriminalMemes.test(text)) {
            console.log(">> 触发语义隔绝：工业/金融反膜生效，Criminal 域塌缩为 0");
            weights.CRIMINAL = -9999; // 物理切断
        }

        // 3. 排序与决断
        const sorted = Object.entries(weights).sort(([,a],[,b]) => b - a);
        
        // 默认回滚
        if (sorted[0][1] <= 0) return 'GENERAL';
        return sorted[0][0];
    }

    // 核心公理：严禁修改此函数逻辑 (Axiom Control)
    generateGua(domain, content) {
        // 二进制映射逻辑：前三位+后三位
        const bin = (content.length > 500 ? '101' : '011') + '100'; 
        // 示例逻辑映射
        const mapping = {
            'CRIMINAL': { name: '坎为水', meaning: 'DANGER / ABYSS' },
            'INDUSTRIAL': { name: '火风鼎', meaning: 'TRANSFORMATION' },
            'FINANCE': { name: '火天大有', meaning: 'POSSESSION IN GREAT MEASURE' },
            'TECHNOLOGY': { name: '离为火', meaning: 'CLARITY / NET' },
            'GENERAL': { name: '地天泰', meaning: 'PEACE' }
        };

        const meta = mapping[domain] || mapping['GENERAL'];
        return { 
            name: meta.name, 
            meaning: meta.meaning, 
            binary: bin, // '101100' -> 既济
            confidence: 0.85 + (Math.random() * 0.1) 
        };
    }
}

// §3 HOLOGRAPHIC RENDERER (Visual Layer)
const UI = {
    els: {
        input: document.getElementById('target'),
        btn: document.getElementById('analyze-btn'),
        gate: document.getElementById('display-gate'),
        log: document.getElementById('log-stream'),
        loadBar: document.getElementById('load-bar'),
        guaMount: document.getElementById('gua-mount'),
        cards: document.querySelectorAll('.insight-card')
    },

    setLoading(state) {
        this.els.btn.disabled = state;
        this.els.btn.innerHTML = state ? 'PROCESSING DATA STREAM...' : '⬡ RUN ENGINE';
        this.els.loadBar.style.width = state ? '100%' : '0%';
        if(state) {
            this.els.gate.style.display = 'none';
            this.els.cards.forEach(c => c.classList.remove('reveal'));
            document.querySelector('.gua-container')?.classList.remove('gua-active');
        }
    },

    log(msg) {
        this.els.log.innerText = `> ${msg}`;
        this.els.log.style.color = '#fff';
        setTimeout(() => this.els.log.style.color = 'var(--text)', 200);
    },

    // 视觉升维：SVG 动态绘制卦象
    renderGua(binaryString) {
        // Binary '1' = Yang (Solid), '0' = Yin (Broken)
        // Draw from Top (index 0) to Bottom (index 5) in SVG structure, 
        // but CSS animates visuals.
        let svgHTML = `<svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="gua-active">`;
        
        for (let i = 0; i < 6; i++) {
            const type = binaryString[i]; // '1' or '0'
            const y = 10 + (i * 14);
            
            if (type === '1') {
                // Yang: Solid Line
                svgHTML += `<rect x="0" y="${y}" width="100" height="8" rx="2" class="yao-rect" />`;
            } else {
                // Yin: Broken Line (Two Rects)
                svgHTML += `<rect x="0" y="${y}" width="42" height="8" rx="2" class="yao-rect" />`;
                svgHTML += `<rect x="58" y="${y}" width="42" height="8" rx="2" class="yao-rect" />`;
            }
        }
        svgHTML += `</svg>`;
        this.els.guaMount.innerHTML = svgHTML;
    },

    renderResults(data) {
        this.els.gate.style.display = 'block';
        
        // Render Text
        document.getElementById('gua-name').innerHTML = `${data.gua.name} <span style="font-size:14px; color:#666">:: ${data.gua.meaning}</span>`;
        document.getElementById('domain-badge').innerText = `DOMAIN: ${data.domain}`;
        document.getElementById('domain-badge').style.borderColor = 
            data.domain === 'CRIMINAL' ? 'var(--red)' : 'var(--gold)';
        
        document.getElementById('p-phys').innerText = data.insights.physics;
        document.getElementById('p-game').innerText = data.insights.game;
        document.getElementById('p-final').innerText = `SYNTHESIS: ${data.insights.synthesis}`;

        // Render Hexagram
        this.renderGua(data.gua.binary);

        // Staggered Reveal Cards
        setTimeout(() => document.getElementById('card-phys').classList.add('reveal'), 100);
        setTimeout(() => document.getElementById('card-game').classList.add('reveal'), 300);
        setTimeout(() => document.getElementById('card-final').classList.add('reveal'), 500);
    }
};

// §4 MAIN CONTROLLER
const app = new Noosphere();
const api = new APIClient();

UI.els.btn.addEventListener('click', async () => {
    const query = UI.els.input.value.trim();
    if (!query) return;

    UI.setLoading(true);
    UI.log('ESTABLISHING UPLINK TO TAVILY NODE...');

    try {
        // 1. 获取数据
        const result = await api.search(query);
        const content = result.results.map(r => r.content).join(' ');
        
        UI.log('ANALYZING SEMANTIC FIELDS...');
        
        // 2. 领域分类 (含语义隔绝逻辑)
        const domain = app.classifyDomain(content);
        
        // 3. 生成卦象 (公理逻辑)
        const gua = app.generateGua(domain, content);

        // 4. 模拟洞察生成 (Mock Insights based on Domain)
        const insights = {
            physics: `Detecting high entropy in ${domain} sector. System phase transition imminent. Data density: ${(content.length/1024).toFixed(2)} KB.`,
            game: domain === 'CRIMINAL' 
                ? "Zero-sum game detected. High risk of recursive retaliation loops." 
                : "Positive-sum cooperative game likely. Nash equilibrium stable.",
            synthesis: result.answer || "Data insufficient for full synthesis. However, vectors indicate a shift in underlying patterns."
        };

        UI.log('RENDERING HOLOGRAPHIC MATRIX...');
        
        // 5. 渲染
        UI.renderResults({ domain, gua, insights });

    } catch (e) {
        UI.log(`CRITICAL ERROR: ${e.message}`);
        console.error(e);
    } finally {
        UI.setLoading(false);
    }
});

// Hit Enter to Search
UI.els.input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') UI.els.btn.click();
});

</script>
</body>
</html>
