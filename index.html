<script>
    // ============================================================
    // STATE MANAGEMENT SYSTEM
    // ============================================================

    class NoosphereState {
        constructor() {
            this.state = {
                query: '',
                loading: false,
                results: null,
                domain: 'GENERAL',
                gua: null,
                insights: {},
                history: this.loadHistory(),
                errors: null,
                timestamp: null,
                searchTime: 0
            };

            this.listeners = new Set();
            this.middlewares = [];
        }

        use(middleware) {
            this.middlewares.push(middleware);
            return this;
        }

        subscribe(listener) {
            this.listeners.add(listener);
            return () => this.listeners.delete(listener);
        }

        async dispatch(action) {
            try {
                for (const middleware of this.middlewares) {
                    await middleware({ action, state: this.state });
                }

                const newState = await this.reduce(action);
                this.state = Object.freeze({
                    ...this.state,
                    ...newState,
                    timestamp: Date.now()
                });

                this.listeners.forEach(listener => listener(this.state));

            } catch (error) {
                console.error('Dispatch error:', error);
                this.state.errors = error.message;
                this.listeners.forEach(listener => listener(this.state));
            }
        }

        async reduce(action) {
            switch (action.type) {
                case 'SEARCH_START':
                    return { loading: true, errors: null, searchTime: Date.now() };

                case 'SEARCH_SUCCESS': {
                    const startTime = this.state.searchTime;
                    const endTime = Date.now();
                    const searchTime = endTime - startTime;

                    const domainResult = this.classifyDomain(action.payload.content);
                    const guaResult = this.generateGua(domainResult, action.payload.content);
                    const insightsResult = this.generateInsights(
                        domainResult,
                        action.payload.query,
                        guaResult
                    );

                    const newHistory = [
                        { query: action.payload.query, timestamp: Date.now(), domain: domainResult },
                        ...this.state.history.slice(0, 49)
                    ];

                    this.saveHistory(newHistory);

                    return {
                        loading: false,
                        results: action.payload,
                        domain: domainResult,
                        gua: guaResult,
                        insights: insightsResult,
                        query: action.payload.query,
                        history: newHistory,
                        searchTime: searchTime
                    };
                }

                case 'SEARCH_FAILURE':
                    return { loading: false, errors: action.payload.error };

                default:
                    return {};
            }
        }

        classifyDomain(content) {
            const weights = {
                CRIMINAL: this.scoreKeywords(content, [
                    { words: ['案', '凶', '死', '罪', '刑', '杀', '抛尸', '法医', '逮捕', '审判', '监狱', '犯罪'], weight: 2 },
                    { words: ['杀害', '谋杀', '犯人', '嫌疑人', '刑事'], weight: 1.5 }
                ]),
                INDUSTRIAL: this.scoreKeywords(content, [
                    { words: ['制造', '热管理', '研发', '技术', '供应', '液冷', '储能', '交付', '产能', '工艺', '芯片', '电池'], weight: 2 },
                    { words: ['生产', '工业', '制造业', '自动化', '设备'], weight: 1.5 }
                ]),
                FINANCE: this.scoreKeywords(content, [
                    { words: ['股', '跌', '涨', '资金', '投资', '财报', '估值', '融资', '破产', '收购'], weight: 2 },
                    { words: ['股市', '基金', '债券', '期货', '交易'], weight: 1.5 }
                ]),
                TECHNOLOGY: this.scoreKeywords(content, [
                    { words: ['算法', '代码', '编程', '软件', '硬件', 'AI', '机器学习', '数据', '云', '网络'], weight: 2 },
                    { words: ['开发', '系统', '架构', '框架', '服务'], weight: 1.5 }
                ]),
                SOCIAL: this.scoreKeywords(content, [
                    { words: ['社会', '人口', '文化', '教育', '政治', '历史', '民众', '舆论'], weight: 2 },
                    { words: ['群体', '社群', '传播', '意识形态'], weight: 1.5 }
                ])
            };

            const sorted = Object.entries(weights)
                .sort(([, a], [, b]) => b - a);

            return sorted[0][1] > 3 ? sorted[0][0] : 'GENERAL';
        }

        scoreKeywords(content, groups) {
            return groups.reduce((score, group) => {
                const groupScore = group.words.reduce((sum, word) => {
                    const count = (content.match(new RegExp(word, 'g')) || []).length;
                    return sum + (count * group.weight);
                }, 0);
                return score + groupScore;
            }, 0);
        }

        generateGua(domain, content) {
            const lowerMap = {
                CRIMINAL: { code: '010', symbol: '☷', name: '坤' },
                INDUSTRIAL: { code: '100', symbol: '☳', name: '震' },
                FINANCE: { code: '110', symbol: '☲', name: '离' },
                TECHNOLOGY: { code: '101', symbol: '☶', name: '乾' },
                SOCIAL: { code: '011', symbol: '☴', name: '巽' },
                GENERAL: { code: '000', symbol: '☵', name: '坎' }
            };

            const contentScore = Math.min(content.length / 100, 10);
            const upperMap = {
                HIGH: { code: '101', symbol: '☶', level: 'HIGH', desc: '高热度' },
                MEDIUM: { code: '011', symbol: '☵', level: 'MEDIUM', desc: '中热度' },
                LOW: { code: '001', symbol: '☱', level: 'LOW', desc: '低热度' }
            };

            const temperatureLevel = contentScore > 6 ? 'HIGH' : contentScore > 3 ? 'MEDIUM' : 'LOW';
            const lower = lowerMap[domain];
            const upper = upperMap[temperatureLevel];
            const bin = upper.code + lower.code;

            const guaLibrary = {
                '101010': { cn: '既济', en: 'COMPLETION', desc: '水火既济，秩序已成' },
                '001010': { cn: '蹇卦', en: 'DIFFICULTY', desc: '山水蹇，前路堵截' },
                '101100': { cn: '噬嗑', en: 'JUDGEMENT', desc: '火雷噬嗑，严厉制裁' },
                '001100': { cn: '颐卦', en: 'NOURISHMENT', desc: '山雷颐，滋养生态' },
                '101110': { cn: '睽卦', en: 'DIVERGENCE', desc: '火泽睽，背道而驰' },
                '110101': { cn: '小过', en: 'MINOR', desc: '雷山小过，微调纠正' },
                '011011': { cn: '中孚', en: 'TRUST', desc: '风泽中孚，信任基础' },
                '111000': { cn: '泰卦', en: 'PEACE', desc: '天地泰，通泰之象' },
                '000111': { cn: '否卦', en: 'STAGNATION', desc: '天地否，阻塞之象' },
                '110110': { cn: '离卦', en: 'CLINGING', desc: '火火离，依附之象' },
                '101101': { cn: '乾卦', en: 'CREATIVE', desc: '天天乾，创意之源' },
                '010101': { cn: '坤卦', en: 'RECEPTIVE', desc: '地地坤，承载万物' }
            };

            const gua = guaLibrary[bin] || {
                cn: '变易',
                en: 'EVOLVING',
                desc: '系统处于变化中，未来尚未确定'
            };

            const confidence = Math.min(0.5 + contentScore * 0.05, 0.95);

            return {
                binary: bin,
                upper: { code: upper.code, symbol: upper.symbol, level: temperatureLevel },
                lower: { code: lower.code, symbol: lower.symbol, domain },
                name: gua.cn,
                meaning: gua.en,
                description: gua.desc,
                confidence: confidence
            };
        }

        generateInsights(domain, query, gua) {
            const escapedQuery = this.escapeHtml(query);

            const templates = {
                CRIMINAL: {
                    physics: {
                        title: 'Entropy & Phase // 熵的临界态',
                        content: `系统进入<span class="key-data">「${gua.confidence > 0.8 ? '高熵冷寂' : '中熵扰动'}态」</span>。因果链条在起点被锁定，信息流向受阻。查询「${escapedQuery}」触发的认知畸变显示系统处于临界失序状态。${gua.confidence > 0.8 ? '■ 置信度: 极高 - 这是明确的信号' : '■ 置信度: 中等 - 需要更多数据验证'}`
                    },
                    game: {
                        title: 'Strategic Game // 单向遮蔽博弈',
                        content: `这场博弈中，信息高度不对称。单方的隐匿能力压倒理性推演。在「${escapedQuery}」的语境中，所有玩家都陷入概率云的无限弥散。<span class="key-data">关键变量</span>：主体身份的不确定性 / 行动的隐蔽性 / 观测者的盲点`
                    },
                    axiom: `【终极公理】真相已被时间熵耗散。观测方式决定了可达的真相边界。`
                },
                INDUSTRIAL: {
                    physics: {
                        title: 'Entropy & Phase // 耗散结构',
                        content: `系统处于<span class="key-data">「负熵聚集态」</span>。技术投入构成能量源，抵抗市场无序。在「${escapedQuery}」的生态中，秩序通过物理约束和优化完成二次重构。◆ 能量流向: 研发 → 产能 → 市场 ◆ 熵流方向: 成本压力 ↔ 技术突破`
                    },
                    game: {
                        title: 'Strategic Game // 供应链协同',
                        content: `核心矛盾：下游成本压力 vs 上游技术领先. 当前处于<span class="key-data">动态帕累托改进期</span>。关键玩家间存在半协作、半竞争的局面。市场化程度越高，博弈空间越大。`
                    },
                    axiom: `【终极公理】效能是生存的唯一度量。技术奇点将重划地缘政治和产业版图。`
                },
                TECHNOLOGY: {

        escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        loadHistory() {
            try {
                const saved = localStorage.getItem('noosphere_history');
                return saved ? JSON.parse(saved) : [];
            } catch (e) {
                return [];

    // ============================================================
    // API CLIENT WITH CACHING & RETRY LOGIC
    // ============================================================

    class APIClient {
        constructor(config = {}) {
            this.baseURL = 'https://api.tavily.com';
            this.timeout = config.timeout || 8000;
            this.retryCount = config.retryCount || 3;
            this.cache = new Map();
        }

        async search(query, options = {}) {
            const sanitized = this.sanitizeQuery(query);
            if (!sanitized) {
                throw new Error('Invalid query: input cannot be empty');
            }

            const cacheKey = `search:${sanitized}`;
            const cached = this.cache.get(cacheKey);
            if (cached && !options.forceRefresh) {
                return cached;
            }

            return this.fetchWithRetry(sanitized, cacheKey, 0);
        }

        async fetchWithRetry(query, cacheKey, attemptCount) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), this.timeout);

                // ============================================================
                // 🔐 PHYSICAL API KEY INJECTION
                // ============================================================
                const response = await fetch(this.baseURL + '/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        api_key: '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',
                        query: query,
                        search_depth: 'basic'
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    if (attemptCount < this.retryCount) {
                        await new Promise(r => setTimeout(r, 1000));
                        return this.fetchWithRetry(query, cacheKey, attemptCount + 1);
                    }
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                this.cache.set(cacheKey, data);
                return data;

            } catch (error) {
                if (error.name === 'AbortError' && attemptCount < this.retryCount) {
                    return this.fetchWithRetry(query, cacheKey, attemptCount + 1);
                }
                throw error;
            }
        }

        sanitizeQuery(query) {
            return String(query).trim().slice(0, 500);
        }
    }

    // ============================================================
    // UI CONTROLLER
    // ============================================================

    class UIController {
        constructor(state, apiClient) {
            this.state = state;
            this.apiClient = apiClient;
            this.elements = this.cacheElements();
            this.setupEventListeners();
            this.setupStateSubscriptions();
        }

        cacheElements() {
            return {
                input: document.getElementById('target'),
                btn: document.getElementById('analyze-btn'),
                logStream: document.getElementById('log-stream'),
                displayGate: document.getElementById('display-gate'),
                guaDraw: document.getElementById('gua-draw'),
                guaName: document.getElementById('gua-name'),
                guaMeaning: document.getElementById('gua-meaning'),
                pPhys: document.getElementById('p-phys'),
                pGame: document.getElementById('p-game'),
                pFinal: document.getElementById('p-final'),
                errorMessage: document.getElementById('error-message'),
                progressFill: document.getElementById('progress-fill'),
                confidenceFill: document.getElementById('confidence-fill'),
                historyContainer: document.getElementById('history-container'),
                statContentLength: document.getElementById('stat-content-length'),
                statDomain: document.getElementById('stat-domain'),
                statTime: document.getElementById('stat-time')
            };
        }

        setupEventListeners() {
            this.elements.input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') this.handleSearch();
            });

            this.elements.btn.addEventListener('click', () => this.handleSearch());

            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('history-item')) {
                    const query = e.target.textContent.split(' - ')[0];
                    this.elements.input.value = query;
                    this.handleSearch();
                }
            });
        }

        setupStateSubscriptions() {
            this.state.subscribe((newState) => {
                this.render(newState);
            });
        }

        async handleSearch() {
            const query = this.elements.input.value.trim();
            if (!query) return;

            this.elements.btn.disabled = true;
            await this.state.dispatch({ type: 'SEARCH_START' });

            try {
                this.updateLog('Accessing Datasphere...');
                const response = await this.apiClient.search(query);

                if (!response.results || response.results.length === 0) {
                    throw new Error('No signals detected in the Datasphere');
                }

                const content = response.results
                    .map(r => (r.content || '') + ' ' + (r.title || ''))
                    .join(' ')
                    .toLowerCase();

                this.updateLog('Calculating Vector Divergence...');
                await this.state.dispatch({
                    type: 'SEARCH_SUCCESS',
                    payload: { query, content }
                });

            } catch (error) {
                this.showError(error.message);
                await this.state.dispatch({
                    type: 'SEARCH_FAILURE',
                    payload: { error: error.message }
                });
            } finally {
                this.elements.btn.disabled = false;
            }
        }

        render(state) {
            if (state.errors) {
                this.showError(state.errors);
            } else if (state.gua) {
                this.renderGua(state.gua);
                this.renderInsights(state.insights);
                this.renderStats(state);
                this.renderHistory(state.history);
                this.revealResults();
            }
        }

        updateLog(message) {
            this.elements.logStream.innerHTML = `<span class="loading-spinner"></span> ${message}`;
            this.elements.progressFill.style.width = '50%';
        }

        renderGua(gua) {
            this.elements.guaDraw.innerHTML = '';
            gua.binary.split('').reverse().forEach((bit, index) => {
                const div = document.createElement('div');
                div.className = bit === '1' ? 'y-line' : 'i-line';
                div.style.animationDelay = `${index * 100}ms`;
                this.elements.guaDraw.appendChild(div);
            });
            this.elements.guaName.textContent = gua.name;
            this.elements.guaMeaning.textContent = `${gua.meaning} / ${gua.description}`;
            this.elements.confidenceFill.style.width = (gua.confidence * 100) + '%';
        }

        renderInsights(insights) {
            this.elements.pPhys.innerHTML = `<strong>${insights.physics.title}</strong><br><br>${insights.physics.content}`;
            this.elements.pGame.innerHTML = `<strong>${insights.game.title}</strong><br><br>${insights.game.content}`;
            this.elements.pFinal.textContent = insights.axiom.content;
        }

        renderStats(state) {
            this.elements.statContentLength.textContent = state.results?.content?.length || 0;
            this.elements.statDomain.textContent = state.domain;
            this.elements.statTime.textContent = state.searchTime;
        }

        renderHistory(history) {
            this.elements.historyContainer.innerHTML = history.slice(0, 10).map(item => {
                return `<div class="history-item">${this.state.escapeHtml(item.query)} - ${item.domain}</div>`;
            }).join('');
        }

        revealResults() {
            this.elements.displayGate.style.display = 'block';
            this.elements.logStream.innerHTML = 'Analysis Complete';
            this.elements.progressFill.style.width = '100%';
            setTimeout(() => this.elements.progressFill.style.width = '0', 2000);
        }

        showError(message) {
            this.elements.errorMessage.textContent = message;
            this.elements.errorMessage.classList.add('show');
            this.elements.logStream.innerHTML = 'Ready to analyze';
            this.elements.progressFill.style.width = '0';
            setTimeout(() => this.elements.errorMessage.classList.remove('show'), 5000);
        }
    }

    // ============================================================
    // INITIALIZATION
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        const state = new NoosphereState();
        const apiClient = new APIClient();
        new UIController(state, apiClient);
    });

</script>
