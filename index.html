<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>万象森罗终端 V9.0 - 语义感知版</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root { --main: #9370DB; --bg: #050505; --text: #dcdcdc; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: "PingFang SC", serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.4) 50%); background-size: 100% 4px; pointer-events: none; z-index: 1; }
        .container { max-width: 500px; width: 100%; position: relative; z-index: 10; }
        .card { background: linear-gradient(145deg, #101010, #030303); border: 1px solid #2a2a2a; border-radius: 24px; padding: 25px; box-shadow: 0 0 30px rgba(147,112,219,0.15); }
        h1 { font-size: 1.3rem; color: var(--main); text-align: center; letter-spacing: 4px; margin: 0 0 5px 0; }
        .subtitle { font-size: 10px; text-align: center; color: #555; margin-bottom: 20px; letter-spacing: 2px; }
        input { background: #111; border: 1px solid #333; color: #fff; padding: 14px; border-radius: 12px; font-size: 13px; width: 100%; margin-bottom: 12px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--main); box-shadow: 0 0 10px rgba(147,112,219,0.2); }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        button { width: 100%; padding: 15px; background: var(--main); color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; letter-spacing: 2px; transition: 0.3s; margin-top: 5px; }
        button:active { transform: scale(0.98); filter: brightness(0.8); }
        .detect-btn { background: transparent; border: 1px solid var(--main); margin-bottom: 15px; color: var(--main); }
        
        #resultArea { margin-top: 25px; display: none; background: rgba(15, 15, 15, 0.9); padding: 20px; border-radius: 16px; border: 1px solid #333; }
        .gua-header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .gua-icon { font-size: 45px; color: var(--main); margin-bottom: 5px; }
        .gua-name { font-size: 18px; font-weight: bold; letter-spacing: 2px; color: #fff; }
        .section-tag { font-size: 11px; color: var(--main); margin-bottom: 8px; font-weight: bold; display: flex; align-items: center; }
        .section-tag::before { content: "►"; margin-right: 5px; font-size: 9px; }
        .section-content { font-size: 13px; line-height: 1.8; color: #aaa; text-align: justify; margin-bottom: 15px; min-height: 40px; }
        #exportBtn { background: #e0e0e0; color: #000; margin-top: 15px; display: none; }
        .loader { font-size: 12px; color: var(--main); text-align: center; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="bg-overlay"></div>

<div class="container">
    <div class="card" id="captureArea">
        <h1>万象森罗智核</h1>
        <div class="subtitle">V9.0 COGNITIVE AWAKENING</div>
        
        <input type="text" id="target" placeholder="🔮 输入观测目标 (支持语义分析)">
        <div id="loadingStatus" class="loader">📡 正在剥取现实切片...</div>
        <button onclick="fetchData()" class="detect-btn" id="aiBtn">① 提取全网情报片段</button>
        
        <div class="input-grid">
            <input type="text" id="p_val" placeholder="时空切片 A (等待提取)">
            <input type="text" id="e_val" placeholder="时空切片 B (等待提取)">
            <input type="text" id="s_val" placeholder="情感锚点 (等待提取)">
            <input type="text" id="t_val" placeholder="逻辑变数 (等待提取)">
        </div>

        <button onclick="runInference()" id="runBtn">② 启动多维语义推演</button>

        <div id="resultArea">
            <div class="gua-header">
                <div id="resGuaIcon" class="gua-icon"></div>
                <div id="resGuaName" class="gua-name"></div>
            </div>
            
            <div class="section-tag">现实坍缩判定</div>
            <div id="resJudge" class="section-content"></div>

            <div class="section-tag">因果暗流洞察</div>
            <div id="resRisk" class="section-content"></div>

            <div class="section-tag">终极降维策略</div>
            <div id="resAdvice" class="section-content"></div>
            
            <button onclick="exportReport()" id="exportBtn">📸 生成推演拓片</button>
        </div>
    </div>
</div>

<script>
const TAVILY_KEY = "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"; 

const wisdom = {
    1: { n: "乾天", i: "䷀", e: "逻辑扩张与秩序重构", p: "向上突破" },
    2: { n: "兑泽", i: "䷹", e: "信息流动与价值溢出", p: "价值交换" },
    3: { n: "离火", i: "䷝", e: "能量爆发与认知明朗", p: "借势升维" },
    4: { n: "震雷", i: "䷲", e: "突发变革与体系洗牌", p: "雷厉风行" },
    5: { n: "巽风", i: "䷸", e: "微观渗透与结构转移", p: "顺势切入" },
    6: { n: "坎水", i: "䷜", e: "周期陷落与不可见盲点", p: "守恒等待" },
    7: { n: "艮山", i: "䷳", e: "触碰边界与止步内省", p: "固本培元" },
    8: { n: "坤地", i: "䷷", e: "承载包容与厚积薄发", p: "顺应包容" }
};

// 专家植入：本地轻量级语义词库 (模拟 NLP 分析)
const lexYang = /涨|赚|生|赢|成功|突破|好|利|解|获|升|强/i; 
const lexYin = /跌|亏|死|杀|败|凶|坏|案|捕|降|弱|缩/i;

async function fetchData() {
    const target = document.getElementById('target').value;
    if(!target) return alert("请输入观测目标");
    const loader = document.getElementById('loadingStatus');
    loader.style.display = 'block';
    
    try {
        const response = await fetch('https://api.tavily.com/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ api_key: TAVILY_KEY, query: target, search_depth: "basic", max_results: 2 })
        });
        const data = await response.json();
        const res = data.results || [];
        
        // 专家优化：不仅提取标题，还提取正文切片(content)以增加情报厚度
        document.getElementById('p_val').value = res[0] ? res[0].title.substring(0,10) : "时序底噪";
        document.getElementById('e_val').value = res[0] && res[0].content ? res[0].content.substring(0,12) : "空间模糊";
        document.getElementById('t_val').value = res[1] ? res[1].title.substring(0,10) : "逻辑坍缩";
        document.getElementById('s_val').value = "集体潜意识";
    } catch (err) {
        document.getElementById('p_val').value = "数据链路受阻";
        document.getElementById('e_val').value = "启用本地锚点";
    } finally {
        loader.style.display = 'none';
    }
}

function analyzeSemantics(text) {
    let score = 0;
    if (lexYang.test(text)) score += 3; // 偏向阳卦 (乾, 兑, 离, 震)
    if (lexYin.test(text)) score -= 3;  // 偏向阴卦 (巽, 坎, 艮, 坤)
    return score;
}

// 专家植入：打字机特效引擎
function typeWriter(elementId, text, speed = 20) {
    const el = document.getElementById(elementId);
    el.innerHTML = "";
    let i = 0;
    return new Promise(resolve => {
        function type() {
            if (i < text.length) {
                el.innerHTML += text.charAt(i);
                i++;
                setTimeout(type, speed);
            } else {
                resolve();
            }
        }
        type();
    });
}

async function runInference() {
    const target = document.getElementById('target').value;
    if(!target) return alert("输入观测目标以拨动因果");

    const p = document.getElementById('p_val').value;
    const e = document.getElementById('e_val').value;
    const s = document.getElementById('s_val').value;
    const t = document.getElementById('t_val').value;
    
    // NLP 语义打分 + 哈希融合
    const semanticOffset = analyzeSemantics(target + p);
    let h = 0;
    const combinedStr = target + p + new Date().getDate();
    for(let i=0; i<combinedStr.length; i++) h = (h << 5) - h + combinedStr.charCodeAt(i);
    h = Math.abs(h + semanticOffset); 

    const u = (h % 8) + 1;
    const l = ((h >> 3) % 8) + 1;
    const intensity = (h % 5) + 5;

    document.getElementById('resultArea').style.display = 'block';
    document.getElementById('exportBtn').style.display = 'none'; // 先隐藏导出按钮
    document.getElementById('resGuaIcon').innerText = wisdom[u].i;
    document.getElementById('resGuaName').innerText = wisdom[u].n + " · " + wisdom[l].n;

    const text1 = `针对观测对象「${target}」，因果律已坍缩至「${wisdom[u].n}」。\n当前「${p}」正与底层切片「${e}」发生深度缠绕。事物稳定性处于第 ${intensity} 能级，表现出显著的${wisdom[u].e}特征。`;
    
    const text2 = `在「${wisdom[l].n}」的暗流下，核心变数在于「${t}」。需重点警惕因果链条中的逻辑死角，若过度依赖「${s}」的惯性，真相或核心价值极易在 2026 年周期内被降维剥离。`;
    
    const text3 = `【上策】：执行「${wisdom[u].p}」策略。借「${t}」为破局杠杆，在变量中共振。\n【中策】：静待能量耗散至临界点，寻找「${wisdom[l].n}」位的价值重估机会。\n【下策】：执迷于表象波动，被动承受底层秩序的重构倾轧。`;

    // 触发打字机特效，按顺序输出
    await typeWriter('resJudge', text1, 15);
    await typeWriter('resRisk', text2, 15);
    await typeWriter('resAdvice', text3, 15);
    
    document.getElementById('exportBtn').style.display = 'block';
}

function exportReport() {
    const area = document.getElementById('captureArea');
    html2canvas(area, { backgroundColor: '#050505', scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.href = canvas.toDataURL();
        link.download = `万象智核-${Date.now()}.png`;
        link.click();
    });
}
</script>
</body>
</html>
