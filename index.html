<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>万象森罗 V6.3 - 触控加固版</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root { --main: #9370DB; --bg: #050505; --text: #dcdcdc; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; 
        }

        /* 纯背景层，彻底不参与任何交互 */
        .bg-fx {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.3) 50%);
            background-size: 100% 4px; pointer-events: none; z-index: -1;
        }

        .container { max-width: 450px; width: 100%; position: relative; z-index: 10; }

        .card { 
            background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 20px; 
            padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { font-size: 1.2rem; color: var(--main); text-align: center; letter-spacing: 3px; margin: 0 0 15px 0; }
        
        .input-group { margin-bottom: 15px; }
        
        input { 
            background: #1a1a1a; border: 1px solid #333; color: #fff; 
            padding: 14px; border-radius: 10px; font-size: 14px; 
            width: 100%; margin-bottom: 8px; outline: none;
        }

        .param-box { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .param-box input { width: calc(50% - 4px); margin-bottom: 0; padding: 10px; font-size: 12px; }

        /* 核心按钮加固 */
        .btn { 
            width: 100%; padding: 16px; border: none; border-radius: 12px; 
            font-weight: bold; cursor: pointer; transition: 0.2s; 
            display: block; text-align: center; position: relative;
            z-index: 999 !important; touch-action: manipulation;
        }

        #aiBtn { background: #2a1a4a; color: var(--main); border: 1px solid var(--main); margin-bottom: 12px; }
        #runBtn { background: var(--main); color: #fff; box-shadow: 0 4px 15px rgba(147,112,219,0.3); }

        .btn:active { transform: translateY(2px) scale(0.98); opacity: 0.9; }

        #resultArea { 
            margin-top: 20px; display: none; background: #161616; 
            padding: 20px; border-radius: 15px; border: 1px solid #333; 
        }

        .gua-icon { font-size: 40px; color: var(--main); text-align: center; margin-bottom: 10px; }
        .gua-name { font-size: 18px; color: #fff; text-align: center; font-weight: bold; margin-bottom: 15px; }
        .section { margin-bottom: 12px; font-size: 13px; line-height: 1.6; color: #aaa; }
        .label { color: var(--main); font-weight: bold; margin-bottom: 4px; display: block; font-size: 11px; }

        #exportBtn { background: #fff; color: #000; margin-top: 15px; }
        .loading { font-size: 12px; color: var(--main); text-align: center; display: none; padding: 10px; }
    </style>
</head>
<body>

<div class="bg-fx"></div>

<div class="container">
    <div class="card" id="captureArea">
        <h1>万象森罗终端 V6.3</h1>
        
        <div class="input-group">
            <input type="text" id="target" placeholder="🔮 输入观测目标 (如: 某项实验)">
        </div>

        <div id="loader" class="loading">📡 情报场同步中...</div>
        
        <button onclick="fetchData()" class="btn" id="aiBtn">① 同步全网情报</button>
        
        <div class="param-box">
            <input type="text" id="p_val" placeholder="天时 (待定)">
            <input type="text" id="e_val" placeholder="地利 (待定)">
            <input type="text" id="s_val" placeholder="人和 (待定)">
            <input type="text" id="t_val" placeholder="神机 (待定)">
        </div>

        <button onclick="runInference()" class="btn" id="runBtn">② 启动非线性推演</button>

        <div id="resultArea">
            <div id="resIcon" class="gua-icon"></div>
            <div id="resName" class="gua-name"></div>
            <div class="section">
                <span class="label">● 逻辑判定</span>
                <div id="resJudge"></div>
            </div>
            <div class="section">
                <span class="label">● 因果指引</span>
                <div id="resAdvice"></div>
            </div>
            <button onclick="exportReport()" class="btn" id="exportBtn">📸 留存天机拓片</button>
        </div>
    </div>
</div>

<script>
const TAVILY_KEY = "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"; 
const wisdom = {
    1: { n: "乾天", i: "䷀", e: "纯阳刚健，底层逻辑剧烈扩张。" },
    2: { n: "兑泽", i: "䷹", e: "悦动映射，信息快速流动。" },
    3: { n: "离火", i: "䷝", e: "文明附丽，能量集中释放。" },
    4: { n: "震雷", i: "䷲", e: "动能爆发，变革清洗体系。" },
    5: { n: "巽风", i: "䷸", e: "渗透扩散，微观变量渗透。" },
    6: { n: "坎水", i: "䷜", e: "陷落陷阱，存在不可见盲点。" },
    7: { n: "艮山", i: "䷳", e: "静止止步，逻辑触碰边界。" },
    8: { n: "坤地", i: "䷷", e: "承载包容，积蓄厚实力量。" }
};

async function fetchData() {
    const t = document.getElementById('target').value;
    if(!t) return alert("请输入目标");
    
    const l = document.getElementById('loader');
    const b = document.getElementById('aiBtn');
    l.style.display = 'block';
    b.disabled = true;

    try {
        const r = await fetch('https://api.tavily.com/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ api_key: TAVILY_KEY, query: t })
        });
        const d = await r.json();
        const s = d.results || [];
        document.getElementById('p_val').value = s[0] ? s[0].title.slice(0,8) : "时序演化";
        document.getElementById('e_val').value = s[1] ? s[1].title.slice(0,8) : "格局确立";
        document.getElementById('t_val').value = "数理坍缩";
        document.getElementById('s_val').value = "意志共鸣";
    } catch (e) {
        document.getElementById('p_val').value = "本地观测";
        document.getElementById('e_val').value = "环境噪点";
    } finally {
        l.style.display = 'none';
        b.disabled = false;
    }
}

function runInference() {
    const t = document.getElementById('target').value;
    if(!t) return alert("请指定观测目标");

    let h = 0;
    const str = t + Date.now();
    for(let i=0; i<str.length; i++) h = (h << 5) - h + str.charCodeAt(i);
    h = Math.abs(h);

    const u = (h % 8) + 1;
    const l = ((h >> 3) % 8) + 1;

    document.getElementById('resIcon').innerText = wisdom[u].i;
    document.getElementById('resName').innerText = wisdom[u].n + " · " + wisdom[l].n;
    document.getElementById('resJudge').innerText = `目标「${t}」当前入「${wisdom[u].n}」格。${wisdom[u].e} 受到外部「${document.getElementById('p_val').value}」的深刻干预。`;
    document.getElementById('resAdvice').innerText = `应借「${wisdom[l].n}」之势，以「${document.getElementById('t_val').value}」为支点，实现价值锚定。`;

    document.getElementById('resultArea').style.display = 'block';
}

function exportReport() {
    const a = document.getElementById('captureArea');
    html2canvas(a, { backgroundColor: '#050505' }).then(c => {
        const l = document.createElement('a');
        l.href = c.toDataURL();
        l.download = `万象-${Date.now()}.png`;
        l.click();
    });
}
</script>
</body>
</html>
