<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V18.0 NOOSPHERE | 全息知性网 - Dynamic Core</title>
    <style>
        :root { --main: #00e5ff; --bg: #050508; --card: #0f111a; --text: #a0a0b0; --gold: #ffd700; --crimson: #ff2a2a; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; display: flex; justify-content: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        .node-container { width: 100%; max-width: 800px; padding: 40px; margin-top: 5vh; }
        
        /* 头部设计 */
        .header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid #222; padding-bottom: 20px; position: relative; }
        .header h1 { font-size: 28px; color: var(--main); letter-spacing: 4px; text-shadow: 0 0 15px rgba(0, 229, 255, 0.4); margin: 0; }
        .header .version { font-size: 10px; color: var(--gold); position: absolute; top: 0; right: 0; border: 1px solid var(--gold); padding: 2px 6px; }

        /* 搜索交互 */
        .search-bay { position: relative; margin-bottom: 30px; }
        input[type="text"] { background: transparent; border: none; border-bottom: 2px solid #333; color: #fff; font-size: 20px; width: 100%; padding: 15px 0; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: var(--main); }
        .core-btn { background: var(--main); color: #000; border: none; padding: 15px; width: 100%; font-weight: 800; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; margin-top: 20px; clip-path: polygon(0 0, 100% 0, 100% 80%, 95% 100%, 0 100%); transition: 0.2s; }
        .core-btn:hover { background: #fff; box-shadow: 0 0 20px var(--main); }

        /* 动态日志 */
        #log-stream { font-family: 'Courier New', monospace; font-size: 12px; color: #555; height: 30px; margin-top: 10px; display: flex; align-items: center; }
        .blink { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* 结果区域 */
        #display-gate { display: none; animation: slideUp 0.8s cubic-bezier(0.23, 1, 0.32, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        /* 卦象可视化 */
        .hex-header { display: flex; align-items: center; gap: 30px; margin-bottom: 40px; border: 1px solid #222; padding: 20px; background: rgba(255,255,255,0.02); }
        .gua-visual { display: flex; flex-direction: column-reverse; gap: 6px; width: 64px; }
        .line { height: 8px; width: 100%; transition: 0.5s; }
        .yang { background: var(--main); box-shadow: 0 0 8px var(--main); }
        .yin { display: flex; justify-content: space-between; }
        .yin::before, .yin::after { content: ''; width: 42%; height: 100%; background: #444; }
        
        .meta-info h2 { margin: 0; color: #fff; font-size: 36px; }
        .meta-info span { color: var(--gold); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

        /* 洞察卡片 */
        .insight-card { margin-bottom: 25px; position: relative; padding-left: 20px; border-left: 2px solid #333; }
        .insight-card::before { content: ''; position: absolute; top: 0; left: -2px; width: 2px; height: 0%; background: var(--main); transition: 1s; }
        .insight-card.active::before { height: 100%; }
        
        .insight-card h3 { font-size: 11px; color: #666; margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }
        .insight-card p { margin: 0; line-height: 1.6; font-size: 14px; color: #ccc; }
        .highlight { color: var(--main); font-weight: bold; }
        .danger { color: var(--crimson); font-weight: bold; }
        
        /* 标签云 */
        .tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .tag { font-size: 10px; border: 1px solid #333; padding: 2px 8px; color: #666; }

    </style>
</head>
<body>

<div class="node-container">
    <div class="header">
        <h1>NOOSPHERE</h1>
        <div class="version">V18.0 CORE</div>
        <p style="color:#444; font-size:12px; margin-top:5px; letter-spacing:2px;">DYNAMIC TRUTH ENGINE // 动态真理引擎</p>
    </div>

    <div class="search-bay">
        <input type="text" id="target" placeholder="输入观测对象 (如: 永生, 硅基生命, 某公司)..." autocomplete="off">
        <button class="core-btn" id="analyze-btn">RUN ENGINE</button>
        <div id="log-stream"><span class="blink">_</span></div>
    </div>

    <div id="display-gate">
        <div class="hex-header">
            <div id="gua-draw" class="gua-visual"></div>
            <div class="meta-info">
                <h2 id="gua-name">--</h2>
                <span id="gua-eng">--</span>
                <div class="tags" id="domain-tags"></div>
            </div>
        </div>

        <div class="insight-card" id="card-phys">
            <h3>Entropy & Phase // 熵相变</h3>
            <p id="p-phys"></p>
        </div>

        <div class="insight-card" id="card-game">
            <h3>Strategic Game // 博弈场</h3>
            <p id="p-game"></p>
        </div>

        <div class="insight-card" id="card-axiom">
            <h3>Final Axiom // 终极判词</h3>
            <p id="p-final" style="color:#fff; font-style:italic;"></p>
        </div>
    </div>
</div>

<script>
/**
 * NOOSPHERE V18.0 KERNEL
 * Architecture: Claude 4.6 ThinkingPro Simulation
 * Features: Dynamic Narrative, Semantic Prism, Chaos Logic
 */

class NoosphereKernel {
    constructor() {
        this.apiConfig = {
            key: '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', // 你的Key
            url: 'https://api.tavily.com/search'
        };
        // 词库 - 用于动态生成不重复的句子
        this.lexicon = {
            verbs: ['坍缩', '重构', '映射', '吞噬', '异化', '解耦', '纠缠', '迭代', '涌现'],
            nouns: ['奇点', '视界', '回声', '幻象', '构念', '算法', '深渊', '变量', '阈值'],
            adjs: ['非线性的', '递归的', '分形的', '熵增的', '虚无的', '临界的', '不可观测的']
        };
    }

    // 1. 核心分类器：语义棱镜 (修复误判问题)
    classify(text) {
        const t = text.toLowerCase();
        
        // 权重计算器
        const calc = (keywords) => keywords.reduce((acc, word) => acc + (t.split(word).length - 1), 0);

        const scores = {
            // 玄学/边缘科学/未来学 (针对“永生”、“外星人”等)
            METAPHYSICS: calc(['永生', '生命', '意识', '外星', '宇宙', '神', '灵魂', '维度', '哲学', '未知', 'ufo', '奇点']) * 2.5,
            
            // 娱乐/文化 (针对“星爷”、“电影”等)
            CULTURE: calc(['电影', '票房', '明星', '导演', '演员', '娱乐', '粉丝', '作品', '文化']) * 2.0,
            
            // 工业/硬科技
            INDUSTRIAL: calc(['制造', '产能', '研发', '技术', '液冷', '供应链', '设备', '量产']) * 1.5,
            
            // 金融/资本
            FINANCE: calc(['股', '资金', '涨停', '跌', '财报', '市值', '投资', '券商']) * 1.8,
            
            // 刑事/案件 (增加负向抑制：如果出现“哲学”、“电影”等词，大幅降低刑事权重)
            CRIMINAL: calc(['案', '凶', '杀', '死', '刑', '警', '罪', '尸', '法医']) * 1.2 
        };

        // ** 逻辑修正：负向抑制 **
        // 如果玄学或文化分数很高，强制削弱刑事分数 (解决“永生”=“死”=“刑事”的bug)
        if (scores.METAPHYSICS > 2 || scores.CULTURE > 2) {
            scores.CRIMINAL *= 0.1; 
        }

        // 排序取最高
        const domain = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        
        // 如果所有分数都很低，归为通用
        if (scores[domain] < 1) return 'GENERAL';
        return domain;
    }

    // 2. 混沌叙事引擎：动态生成判词 (解决复读机问题)
    generateNarrative(domain, query, snippet) {
        // 从搜索结果中提取最长/最复杂的3个词作为“观测变量”
        const vars = this.extractVariables(snippet);
        
        const templates = {
            METAPHYSICS: {
                phys: [
                    `检测到现实扭曲场。关于「${query}」的探讨正在突破常规物理边界。关键变量 <span class="highlight">${vars[0]}</span> 表现出非定域性特征。`,
                    `系统进入高维纠缠态。在“${query}”的语境中，物质与意识的界限正在模糊。熵值逆流，指向未知的奇点。`,
                    `观测到形而上学扰动。${vars[1] || '未知因子'} 正在重构我们对存在的定义。这是一场关于定义的战争。`
                ],
                game: [
                    `认知博弈。由于缺乏实证锚点，所有参与者都在通过 <span class="highlight">${vars[1]}</span> 争夺解释权。`,
                    `这是一场零和信仰游戏。谁定义了“${query}”，谁就掌握了未来的叙事权。`,
                    `观测者效应显著。你的观测行为本身正在改变「${query}」的波函数坍缩方向。`
                ],
                axiom: [
                    `【终极公理】未被观测的即是不存在的。真理是共识的投影。`,
                    `【终极公理】碳基生命的终极恐惧，是硅基生命的常规迭代。`,
                    `【终极公理】所有的永恒都是瞬间的驻波。`
                ]
            },
            CULTURE: {
                phys: [
                    `文化模因（Meme）的高频震荡。关于「${query}」的信息流正在形成回声室效应。核心符号：<span class="highlight">${vars[0]}</span>。`,
                    `情感能量的集体共振。该对象已从实体转化为一种符号索引，承载了大众的心理投射。`,
                    `偶像光环的熵减效应。通过持续的注意力注入，${query} 维持着低熵的有序形象。`
                ],
                game: [
                    `注意力经济的收割游戏。流量即权力，<span class="highlight">${vars[1]}</span> 是变现的筹码。`,
                    `造神与毁神的循环。大众既是信徒也是审判者，情绪波动极快。`,
                ],
                axiom: [
                    `【终极公理】娱乐至死。我们热爱的将毁灭我们，或拯救我们。`,
                    `【终极公理】符号的生命力取决于被引用的频率。`
                ]
            },
            CRIMINAL: {
                phys: [
                    `高熵破坏性事件。社会秩序的局部断裂。关键词 <span class="danger">${vars[0]}</span> 标记了系统的溃烂点。`,
                    `因果链的暴力截断。在${query}事件中，人性的黑暗面导致了不可逆的物理状态改变。`
                ],
                game: [
                    `猫鼠游戏。信息不对称的极致体现。真相被掩盖在噪音之中。`,
                    `正义与程序的拉锯战。每一份证据都是博弈的筹码。`
                ],
                axiom: [
                    `【终极公理】凝视深渊过久，深渊便回以凝视。`,
                    `【终极公理】所有的罪恶都是为了填补欲望的空洞。`
                ]
            },
            // ... 可以继续扩展其他领域
            GENERAL: {
                phys: [
                    `系统处于标准演化态。针对「${query}」的数据流显示出 <span class="highlight">${vars[0]}</span> 的离散分布特征。`,
                    `普通的各种可能性叠加。未来尚未坍缩，一切取决于 <span class="highlight">${vars[1]}</span> 的权重。`
                ],
                game: [
                    `多方利益的动态平衡。没有绝对的赢家，只有暂时的妥协。`,
                    `信息差决定了博弈的胜负。`
                ],
                axiom: [
                    `【终极公理】变化是唯一的常量。`,
                    `【终极公理】数据不会撒谎，但解读数据的人会。`
                ]
            }
        };

        // 如果没有特定领域的模板，回退到 GENERAL
        const t = templates[domain] || templates.GENERAL;
        
        // 随机选择器
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

        return {
            phys: pick(t.phys),
            game: pick(t.game),
            axiom: pick(t.axiom),
            vars: vars
        };
    }

    // 辅助：从文本中提取看起来“高级”的词
    extractVariables(text) {
        // 简单的提取逻辑：提取长词，排除常用虚词
        const clean = text.replace(/[^\u4e00-\u9fa5]/g, ' ');
        const words = clean.split(' ').filter(w => w.length >= 2 && w.length <= 4);
        // 去重并随机打乱
        const unique = [...new Set(words)];
        return unique.sort(() => 0.5 - Math.random()).slice(0, 5);
    }

    // 3. 卦象生成器 (保持V17的稳定性但增加神秘感)
    generateHexagram(domain, seedText) {
        // 根据文本长度生成一个伪随机Hash
        let hash = 0;
        for (let i = 0; i < seedText.length; i++) hash = (hash << 5) - hash + seedText.charCodeAt(i);
        hash = Math.abs(hash);

        const maps = {
            METAPHYSICS: { name: '大有', eng: 'POSSESSION / 火天大有', bin: '101111' },
            CULTURE: { name: '咸卦', eng: 'INFLUENCE / 泽山咸', bin: '011100' },
            INDUSTRIAL: { name: '革卦', eng: 'REVOLUTION / 泽火革', bin: '011101' },
            FINANCE: { name: '姤卦', eng: 'COUPLING / 天风姤', bin: '111110' },
            CRIMINAL: { name: '讼卦', eng: 'CONFLICT / 天水讼', bin: '111010' },
            GENERAL: { name: '未济', eng: 'BEFORE COMPLETION', bin: '101010' }
        };

        // 30%概率出现变爻（随机卦），70%概率出现领域定式卦
        if (hash % 10 > 7) {
            return { 
                name: '无妄', eng: 'INNOCENCE / 天雷无妄', 
                bin: (hash % 64).toString(2).padStart(6, '0') 
            };
        }
        
        return maps[domain] || maps.GENERAL;
    }
}

// UI 逻辑控制器
const kernel = new NoosphereKernel();
const ui = {
    input: document.getElementById('target'),
    btn: document.getElementById('analyze-btn'),
    log: document.getElementById('log-stream'),
    gate: document.getElementById('display-gate'),
    
    // 启动引擎
    async run() {
        const query = this.input.value.trim();
        if(!query) return;
        
        this.startLoading();
        
        try {
            // 1. 发起搜索 (Tavily)
            const res = await fetch(kernel.apiConfig.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    api_key: kernel.apiConfig.key,
                    query: query,
                    search_depth: "basic",
                    max_results: 5
                })
            });
            
            const data = await res.json();
            const content = data.results.map(r => r.content).join(" ");
            
            // 2. 运行内核逻辑
            this.log.innerText = "Processing Logic Matrix...";
            await new Promise(r => setTimeout(r, 600)); // 假装思考
            
            const domain = kernel.classify(query + " " + content);
            const narrative = kernel.generateNarrative(domain, query, content);
            const hex = kernel.generateHexagram(domain, content);
            
            // 3. 渲染结果
            this.render(domain, hex, narrative);

        } catch(e) {
            this.log.innerText = "Error: Connection Lost in Void.";
            console.error(e);
        } finally {
            this.stopLoading();
        }
    },

    render(domain, hex, narrative) {
        // 渲染卦象
        const draw = document.getElementById('gua-draw');
        draw.innerHTML = '';
        hex.bin.split('').forEach(bit => {
            const el = document.createElement('div');
            el.className = `line ${bit === '1' ? 'yang' : 'yin'}`;
            draw.appendChild(el);
        });
        
        document.getElementById('gua-name').innerText = hex.name;
        document.getElementById('gua-eng').innerText = hex.eng;
        
        // 渲染标签
        const tagBox = document.getElementById('domain-tags');
        tagBox.innerHTML = `<span class="tag" style="color:var(--main); border-color:var(--main)">${domain}</span>` + 
                           narrative.vars.slice(0,3).map(v => `<span class="tag">${v}</span>`).join('');

        // 渲染文字
        document.getElementById('p-phys').innerHTML = narrative.phys;
        document.getElementById('p-game').innerHTML = narrative.game;
        document.getElementById('p-final').innerHTML = narrative.axiom;
        
        // 激活卡片动画
        this.gate.style.display = 'block';
        document.querySelectorAll('.insight-card').forEach(c => c.classList.remove('active'));
        setTimeout(() => document.querySelectorAll('.insight-card').forEach(c => c.classList.add('active')), 100);
        
        this.log.innerText = "Analysis Complete // 观测完成";
    },

    startLoading() {
        this.btn.disabled = true;
        this.btn.innerText = "SCANNING...";
        this.log.innerHTML = "Accessing Noosphere... <span class='blink'>_</span>";
        this.gate.style.display = 'none';
    },

    stopLoading() {
        this.btn.disabled = false;
        this.btn.innerText = "RUN ENGINE";
    }
};

// 绑定事件
document.getElementById('analyze-btn').onclick = () => ui.run();
document.getElementById('target').onkeypress = (e) => { if(e.key === 'Enter') ui.run(); };

</script>
</body>
</html>
