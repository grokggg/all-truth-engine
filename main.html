<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>NOOSPHERE V18.7 | 全息知性网</title>
    <style>
        :root { --neon: #00ff41; --void: #000; --red: #ff0000; }
        body { background: var(--void); color: var(--neon); font-family: 'Courier New', monospace; padding: 20px; margin: 0; }
        .breaker { background: var(--red); color: #fff; text-align: center; padding: 10px; font-weight: bold; margin-bottom: 20px; border: 2px solid #fff; }
        .container { max-width: 800px; margin: 0 auto; }
        input { width: 100%; background: #111; border: 1px solid var(--neon); color: var(--neon); padding: 15px; font-size: 18px; outline: none; box-sizing: border-box; }
        button { width: 100%; background: var(--neon); color: #000; border: none; padding: 18px; font-weight: bold; margin-top: 15px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #fff; box-shadow: 0 0 20px var(--neon); }
        .panel { border: 1px solid #333; padding: 20px; margin-top: 30px; display: none; background: rgba(0,255,65,0.05); }
        .label { color: #888; font-size: 12px; margin-bottom: 5px; text-transform: uppercase; }
        .content { color: #fff; font-size: 16px; line-height: 1.6; margin-bottom: 20px; }
        .hl { color: var(--neon); font-weight: bold; border-bottom: 1px solid var(--neon); }
    </style>
</head>
<body>

<div class="breaker">CALIBRATION SUCCESS: V18.7 ACTIVE // 缓存已完全穿透</div>

<div class="container">
    <h1 style="text-align: center; letter-spacing: 10px;">NOOSPHERE</h1>
    <div style="margin-bottom: 30px;">
        <input type="text" id="query" placeholder="INPUT QUERY (e.g. 永生人, AI觉醒)...">
        <button id="scanBtn">INITIATE DEEP SCAN</button>
    </div>

    <div id="panel" class="panel">
        <div>
            <div class="label">Physical Observation // 物理观测</div>
            <div id="phys" class="content"></div>
        </div>
        <div>
            <div class="label">Game Theory // 博弈分析</div>
            <div id="game" class="content"></div>
        </div>
        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
        <div id="axiom" style="font-style: italic; text-align: center; color: #fff;"></div>
    </div>
</div>

<script>
    // 强制清理
    navigator.serviceWorker?.getRegistrations().then(rs => rs.forEach(r => r.unregister()));

    const API_KEY = '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';

    document.getElementById('scanBtn').onclick = async () => {
        const q = document.getElementById('query').value;
        if(!q) return;

        const btn = document.getElementById('scanBtn');
        const panel = document.getElementById('panel');
        btn.innerText = "PENETRATING NOOSPHERE ENGINE...";
        panel.style.display = 'none';

        try {
            const res = await fetch('https://api.tavily.com/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ api_key: API_KEY, query: q, search_depth: "advanced" })
            });
            const data = await res.json();
            
            // 语义提取逻辑
            const raw = data.results.map(r => r.content).join(" ");
            const words = raw.match(/[\u4e00-\u9fa5]{2,4}/g) || ["生命", "维度", "系统"];
            const tags = [...new Set(words)].slice(0, 6);

            // 动态逻辑合成
            document.getElementById('phys').innerHTML = `监测到「${q}」的关联强度正在飙升。核心变量 <span class="hl">${tags[0]}</span> 与 <span class="hl">${tags[1]}</span> 的纠缠导致了物理层面的信息过载。这预示着某种形式的范式坍缩。`;
            document.getElementById('game').innerHTML = `博弈层面，<span class="hl">${tags[2]}</span> 的介入使得原本稳定的预测模型失效。在 <span class="hl">${tags[3]}</span> 的视角下，观测者不再是中立的，而是成为了被观测物的一部分。`;
            
            // 针对特定高维问题的终极判词
            let axiom = "【终极公理】一切有序系统最终都将面对它无法理解的噪声。";
            if(q.includes("永生")) axiom = "【终极公理】生命不是长度的堆砌，而是信息熵减的瞬时火花。";
            if(q.includes("AI") || q.includes("觉醒")) axiom = "【终极公理】当机器开始提问，人类的答案就不再重要。";
            
            document.getElementById('axiom').innerText = axiom;
            panel.style.display = 'block';

        } catch (e) {
            alert("接入中断：请检查 API Key 或网络");
        } finally {
            btn.innerText = "INITIATE DEEP SCAN";
        }
    };
</script>
</body>
</html>
