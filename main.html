<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>NOOSPHERE V18.7 | 终极穿透版</title>
    <style>
        /* 18.7 专属视觉：黑绿高反差，如果不是这个颜色，说明你还没刷出来 */
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; line-height: 1.5; }
        #debug-tag { background: #f00; color: #fff; padding: 5px; text-align: center; font-weight: bold; }
        input { background: #111; border: 1px solid #0f0; color: #0f0; width: 100%; padding: 10px; box-sizing: border-box; }
        button { background: #0f0; color: #000; border: none; width: 100%; padding: 15px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        .card { border: 1px solid #0f0; margin-top: 20px; padding: 15px; background: rgba(0,255,0,0.05); }
        .hl { color: #fff; background: #060; padding: 0 4px; }
    </style>
</head>
<body>

    <div id="debug-tag">SYSTEM CALIBRATION: V18.7 ACTIVE // 缓存已击穿</div>

    <div style="max-width: 600px; margin: 0 auto;">
        <h2>⬢ NOOSPHERE V18.7</h2>
        <input type="text" id="q" placeholder="输入观测对象 (如: 永生人, AI觉醒)...">
        <button onclick="run()">INITIATE DEEP SCAN</button>
        
        <div id="out" style="display:none;">
            <div class="card">
                <div style="font-size:10px; color:#555;">PHASE I: PHYSICAL // 物理观测</div>
                <p id="t1"></p>
            </div>
            <div class="card">
                <div style="font-size:10px; color:#555;">PHASE II: GAME // 博弈构效</div>
                <p id="t2"></p>
            </div>
            <div class="card">
                <div style="font-size:10px; color:#555;">PHASE III: AXIOM // 终极公理</div>
                <p id="t3" style="font-style:italic; color:#fff;"></p>
            </div>
        </div>
    </div>

<script>
    // 强制清除残留的 Service Worker
    navigator.serviceWorker?.getRegistrations().then(rs => rs.forEach(r => r.unregister()));

    async function run() {
        const query = document.getElementById('q').value;
        if(!query) return;
        
        document.getElementById('out').style.display = 'none';
        const btn = document.querySelector('button');
        btn.innerText = "PENETRATING NOOSPHERE...";
        
        try {
            const res = await fetch('https://api.tavily.com/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    api_key: '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',
                    query: query,
                    search_depth: "advanced"
                })
            });
            const data = await res.json();
            
            // 语义重组引擎：抓取真实词汇
            const content = data.results.map(r => r.content).join(" ");
            const words = content.match(/[\u4e00-\u9fa5]{2,4}/g) || ["逻辑", "数据", "奇点"];
            const uniqueWords = [...new Set(words)].slice(0, 5);

            // 动态生成
            document.getElementById('t1').innerHTML = `针对「${query}」的扫描显示，<span class="hl">${uniqueWords[0]}</span> 与 <span class="hl">${uniqueWords[1]}</span> 正在发生高维耦合。`;
            document.getElementById('t2').innerHTML = `博弈层面，<span class="hl">${uniqueWords[2] || '未知'}</span> 的介入打破了原有的稳态，观测者陷入了概率云弥散。`;
            document.getElementById('t3').innerText = query.includes('永生') ? "【终极公理】死亡不过是物质形态的降级，信息永不消亡。" : "【终极公理】观测行为本身即是创造。";
            
            document.getElementById('out').style.display = 'block';
        } catch (e) {
            alert("接入失败：请检查网络或 API Key");
        } finally {
            btn.innerText = "INITIATE DEEP SCAN";
        }
    }
</script>
</body>
</html>
